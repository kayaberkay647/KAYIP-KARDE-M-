/* ==========================================================================
   YARDIMCILAR
   ========================================================================== */
const W = 1080, H = 1920, TAU = Math.PI * 2;
const cv = document.getElementById('c'), c = cv.getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = k => k * k * (3 - 2 * k);
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const rgba = (c3, a = 1) => `rgba(${c3[0] | 0},${c3[1] | 0},${c3[2] | 0},${a})`;
const mix3 = (p, q, k) => [lerp(p[0], q[0], k), lerp(p[1], q[1], k), lerp(p[2], q[2], k)];
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function tuval(w, h) { const k = document.createElement('canvas'); k.width = w; k.height = h; return k; }
const sallan = (t, a, f = 1) => [a * (Math.sin(t * 17.3 * f) * .6 + Math.sin(t * 29.1 * f + 1) * .4), a * (Math.sin(t * 13.7 * f + 2) * .6 + Math.sin(t * 23.3 * f) * .4)];
function kamera(ctx, x, y, z, s = [0, 0]) { ctx.translate(W / 2 + s[0], H / 2 + s[1]); ctx.scale(z, z); ctx.translate(-x, -y); }
// Çekim listesi: [bas, bit, [x,y,z] başlangıç, [x,y,z] bitiş]
function cekim(t, list) {
  for (let i = 0; i < list.length; i++) { const s = list[i]; if (t >= s[0] && t < s[1]) { const k = eio(seg(t, s[0], s[1])); return { x: lerp(s[2][0], s[3][0], k), y: lerp(s[2][1], s[3][1], k), z: lerp(s[2][2], s[3][2], k), i, lt: t - s[0] }; } }
  const s = list[list.length - 1]; return { x: s[3][0], y: s[3][1], z: s[3][2], i: list.length - 1, lt: t - s[0] };
}

  if (a <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(x, y); ctx.scale(1, sk);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r); g.addColorStop(0, rgba(renk, a)); g.addColorStop(.35, rgba(renk, a * .42)); g.addColorStop(1, rgba(renk, 0));
  ctx.fillStyle = g; ctx.fillRect(-r, -r, r * 2, r * 2); ctx.restore();
}
function golge(ctx, x, y, r, a, sk = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1, sk); const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r); g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(-r, -r, 2 * r, 2 * r); ctx.restore();
}

function dikdortgen(ctx, x, y, w, h, renk) { ctx.fillStyle = renk; ctx.fillRect(x, y, w, h); }
function dg(ctx, x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); for (const [p, cl] of stops) g.addColorStop(p, cl); return g; }
function poly(ctx, pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); ctx.fill(); }
function el(g, x, y, rx, ry, r = 0) { g.beginPath(); g.ellipse(x, y, Math.abs(rx), Math.abs(ry), r, 0, TAU); g.fill(); }
// Yumuşak kapalı şekil (noktalar kontrol noktası olarak kullanılır)
function yum(g, pts, dolgu = true) {
  const n = pts.length, m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  g.beginPath(); const m0 = m(pts[n - 1], pts[0]); g.moveTo(m0[0], m0[1]);
  for (let i = 0; i < n; i++) { const p = pts[i], q = m(p, pts[(i + 1) % n]); g.quadraticCurveTo(p[0], p[1], q[0], q[1]); }
  g.closePath(); if (dolgu) g.fill();
}
// Konik uzuv (kapsül)
function kap(g, x1, y1, r1, x2, y2, r2) {
  const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy) || 1, a = Math.atan2(dy, dx), b = Math.acos(clamp((r1 - r2) / d, -1, 1));
  g.beginPath(); g.arc(x1, y1, r1, a + b, a - b + TAU); g.arc(x2, y2, r2, a - b, a + b); g.closePath(); g.fill();
}

}

const TARAMA = tuval(W, H); { const g = TARAMA.getContext('2d'); g.fillStyle = 'rgba(0,0,0,.22)'; for (let y = 0; y < H; y += 4) g.fillRect(0, y, W, 2); }
// Karanlık maskesi: ekranı karartır, ışık noktalarında delik açar (dünya koordinatlarında)

function karanlik(ctx, taban, isiklar, renk = '0,0,0') {

        const o = osc('sine', 180), g2 = kazanc(0, cik); o.connect(g2); zarf(g2, tt, .4, .002, .05); o.start(tt); o.stop(tt + .06); } break; }

      pan.pan.setValueAtTime(-.8, w); pan.pan.linearRampToValueAtTime(.8, w + kalan); g.gain.setValueAtTime(0, w); g.gain.linearRampToValueAtTime(.7, w + kalan * .5); g.gain.linearRampToValueAtTime(0, w + kalan);
      f.frequency.setValueAtTime(500, w); f.frequency.linearRampToValueAtTime(1100, w + kalan * .5); f.frequency.linearRampToValueAtTime(400, w + kalan); s.start(w); s.stop(w + kalan); break; }
    case 'anahtar': { for (let i = 0; i < 9; i++) { const tt = w + Math.random() * .45, o = osc('sine', 2600 + Math.random() * 3800), g = kazanc(0, cik); o.connect(g); zarf(g, tt, .12, .001, .18); o.start(tt); o.stop(tt + .2); } break; }
    case 'kapiKapan': { yk.gain.value = .6; const o = osc('sine', 80), g = kazanc(0, cik); o.frequency.exponentialRampToValueAtTime(40, w + .3); o.connect(g); zarf(g, w, 1, .005, .5); o.start(w); o.stop(w + .55);
      const s = gurultu(), f = filtre('lowpass', 700), g2 = kazanc(0, cik); s.connect(f); f.connect(g2); zarf(g2, w, .8, .002, .25); s.start(w); s.stop(w + .3);
      const s2 = gurultu(), f2 = filtre('bandpass', 3000, 4), g3 = kazanc(0, cik); s2.connect(f2); f2.connect(g3); zarf(g3, w + .06, .6, .001, .05); s2.start(w + .06); s2.stop(w + .12); break; }
    case 'kilit': { const s = gurultu(), f = filtre('bandpass', 2600, 3), g = kazanc(0, cik); s.connect(f); f.connect(g); zarf(g, w, 1, .001, .06); s.start(w); s.stop(w + .08);
      const o = osc('sine', 1850), g2 = kazanc(0, cik); o.connect(g2); zarf(g2, w, .14, .001, .12); o.start(w); o.stop(w + .14);
      const o2 = osc('sine', 140), g3 = kazanc(0, cik); o2.connect(g3); zarf(g3, w + .02, .5, .002, .08); o2.start(w); o2.stop(w + .12); break; }
    case 'tik': { const s = gurultu(), f = filtre('highpass', 3000), g = kazanc(0, cik); s.connect(f); f.connect(g); zarf(g, w, .7, .001, .02); s.start(w); s.stop(w + .03); break; }
    case 'petek': { const o = osc('triangle', 3100 + Math.random() * 400), g = kazanc(0, cik); o.connect(g); zarf(g, w, .08, .001, .05); o.start(w); o.stop(w + .06); const s = gurultu(), f = filtre('bandpass', 2000, 5), g2 = kazanc(0, cik); s.connect(f); f.connect(g2); zarf(g2, w, .3, .001, .03); s.start(w); s.stop(w + .04); break; }
    case 'vizilti': { const o = osc('sawtooth', 100), f = filtre('bandpass', 200, 3), g = kazanc(0, cik); o.connect(f); f.connect(g); surekli(g, w, kalan, .25, .3, .2);
      if (e.titrek) { for (let x = 0; x < kalan; x += .11) if (Math.random() > .55) { g.gain.setValueAtTime(0, w + x); g.gain.setValueAtTime(.25, w + x + .05); } }
      o.start(w); o.stop(w + kalan); break; }

      for (const fr of [55, 55.6, 27.5, 82.4]) { const o = osc(fr < 30 ? 'sine' : 'sawtooth', fr); const og = kazanc(fr > 80 ? .3 : 1, f); o.connect(og); o.start(w); o.stop(w + kalan); }
      const hi = osc('sine', 1244.5), hg = kazanc(0, cik); hi.connect(hg); hg.gain.setValueAtTime(0, w); hg.gain.linearRampToValueAtTime(.02, w + kalan); hi.start(w); hi.stop(w + kalan);

    case 'kopek': { const f = filtre('lowpass', e.uzak ? 700 : 1300); f.connect(kazanc(.35, cik)); yk.gain.value = 1.2; const fy = kazanc(1, SES.yanki); f.connect(fy);
      for (const d of [0, .26, .7]) { const o = osc('sawtooth', 430), g = kazanc(0, f); o.frequency.setValueAtTime(430, w + d); o.frequency.exponentialRampToValueAtTime(250, w + d + .13); o.connect(g); zarf(g, w + d, .2, .02, .16); o.start(w + d); o.stop(w + d + .18); } break; }

    case 'adim': { const ar = e.aralik || .6; for (let x = Math.ceil(ofs / ar) * ar; x < e.sure; x += ar) { const tt = w + x - ofs; const s = gurultu(), f = filtre('lowpass', 420), g = kazanc(0, cik); s.connect(f); f.connect(g); zarf(g, tt, .6, .004, .12); s.start(tt); s.stop(tt + .15);

function replikCal(r, w, ofs) {
  const b = SES.tampon[r.dosya]; if (!b) return;
  const A = SES.A, ef = r.efekt || '', U = ef.includes('U'), TELF = ef.includes('TEL'), KAPI = ef.includes('KAPI');
  const hiz = U ? .944 : (KAPI ? .97 : 1);
  if (ofs >= b.duration / hiz) return;
  const g = kazanc(AYAR.diyalogSes * (r.ses ?? 1), SES.ana);
  let son = g;
  if (TELF) { const h = filtre('highpass', 380), l = filtre('lowpass', 3200), p = filtre('peaking', 1600, 1); p.gain.value = 6; h.connect(l); l.connect(p); p.connect(g); son = h; }
  if (KAPI) { const l = filtre('lowpass', 1400), l2 = filtre('lowpass', 1800); l.connect(l2); l2.connect(g); const ok = kazanc(.9, SES.oda); l2.connect(ok); son = l; }
  const s = izle(A.createBufferSource()); s.buffer = b; s.playbackRate.value = hiz; s.connect(son); s.start(w, ofs * hiz);
  if (U) { const yk = kazanc(.45, SES.yanki); son.connect(yk); }
}
function hepsiniPlanla(ofs) {
  const now = SES.A.currentTime + .05;
  for (const e of AYAR.efektler) { const son = e.t + (e.sure || 4); if (son <= ofs) continue; efektCal(e, now + Math.max(0, e.t - ofs), Math.max(0, ofs - e.t)); }
  for (const r of AYAR.replikler) { if (r.t + 30 <= ofs) continue; replikCal(r, now + Math.max(0, r.t - ofs), Math.max(0, ofs - r.t)); }
  return now;
}
function hepsiniDurdur() { for (const n of SES.aktif) { try { n.stop(); } catch (e) { } } SES.aktif = []; }

/* ---------- Ses dosyaları ---------- */
SES.bekleyen = {};
const dosyalar = [...new Set(AYAR.replikler.map(r => r.dosya))];
function cozVeKaydet(ad, arr) {
  if (!SES.A) { SES.bekleyen[ad] = arr; return Promise.resolve(); }
  return SES.A.decodeAudioData(arr.slice(0)).then(b => { SES.tampon[ad] = b; delete SES.bekleyen[ad]; durumGuncelle(); }).catch(() => { });
}
function durumGuncelle() {
  const n = Object.keys(SES.tampon).length + Object.keys(SES.bekleyen).length;
  if (n) document.getElementById('durum').innerHTML = `<b>${n} / ${dosyalar.length}</b> diyalog sesi yüklendi. Eksik olanlar altyazı olarak görünür.`;
}
async function klasordenYukle() {
  if (location.protocol === 'file:') return;
  await Promise.all(dosyalar.map(async ad => { try { const res = await fetch(`${AYAR.sesKlasoru}/${ad}`); if (res.ok) SES.bekleyen[ad] = await res.arrayBuffer(); } catch (e) { } }));
  durumGuncelle();
}
document.getElementById('sesDosya').addEventListener('change', async ev => {
  for (const f of ev.target.files) { const m = f.name.toUpperCase().match(/R(\d{2})/); if (!m) continue; const ad = dosyalar.find(d => d.includes('_R' + m[1] + '_')); if (!ad) continue; sesBaslat(); await cozVeKaydet(ad, await f.arrayBuffer()); }
  durumGuncelle(); if (oynuyor) { const t = simdi(); dur(); oynat(t); }
});

/* ==========================================================================
   OYNATICI
   ========================================================================== */
let oynuyor = false, basOfs = 0, basZaman = 0;
const btn = document.getElementById('oynat'), bar = document.getElementById('ilerleme'), zEl = document.getElementById('zaman');
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function simdi() { return oynuyor ? basOfs + (SES.A.currentTime - basZaman) : basOfs; }
function oynat(ofs = basOfs) {
  sesBaslat(); SES.A.resume(); if (ofs >= AYAR.sure - .05) ofs = 0;
  hepsiniDurdur(); basOfs = ofs; basZaman = hepsiniPlanla(ofs); oynuyor = true; btn.textContent = '⏸ Duraklat';
  document.getElementById('baslat').style.display = 'none';
}
function dur() { if (!oynuyor) return; basOfs = simdi(); oynuyor = false; hepsiniDurdur(); btn.textContent = '▶ Oynat'; }
function dongu() {
  let t = simdi();
  if (oynuyor && t >= AYAR.sure) { dur(); basOfs = AYAR.sure; t = AYAR.sure; }
  cizim(Math.max(0, t));
  if (!bar.matches(':active')) bar.value = t; zEl.textContent = `${fmt(t)} / ${fmt(AYAR.sure)}`;
  requestAnimationFrame(dongu);
}
btn.onclick = () => oynuyor ? dur() : oynat();
document.getElementById('baslat').onclick = () => oynat(0);
bar.oninput = () => { const v = +bar.value; if (oynuyor) { hepsiniDurdur(); oynat(v); } else basOfs = v; };
document.getElementById('altyaziKutu').onchange = e => AYAR.altyazi = e.target.checked;
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); oynuyor ? dur() : oynat(); } });
const q = new URLSearchParams(location.search);
if (q.get('altyazi') === '0') { AYAR.altyazi = false; document.getElementById('altyaziKutu').checked = false; }
if (q.has('t')) { basOfs = +q.get('t'); document.getElementById('baslat').style.display = 'none'; }
klasordenYukle();
if (!q.has('disa')) (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(dongu));
</script>
