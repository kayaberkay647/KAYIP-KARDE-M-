<div id="sahne"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="panel"><button id="oynat">▶ Oynat</button><input id="zaman" type="range" min="0" max="53" step="0.01" value="0"><span id="saat">0.00</span></div>
<audio id="ses" preload="auto" src="ses/miks.wav" onerror="this.src='ses/konusma_temiz.wav'"></audio>

<script>
  // Kısayol: Boşluk = oynat/duraklat. ?t=12.5 → o saniyenin karesi. ?render=1 → dışa aktarma modu.
  const q = new URLSearchParams(location.search);
  if (q.has('render')) document.body.classList.add('render');
  X = document.getElementById('c').getContext('2d');
  let hazir = false; window.HAZIR = () => hazir;
  (async () => {
    await fontlariYukle(); dokuHazirla(); hazir = true;
    const ses = document.getElementById('ses'), kay = document.getElementById('zaman'), saat = document.getElementById('saat'), btn = document.getElementById('oynat');
    let t0 = +(q.get('t') || 0), oyn = false, bas = 0;
    const goster = t => { ciz(t); kay.value = t; saat.textContent = t.toFixed(2); };
    goster(t0);
    if (q.has('render')) return;
    const dongu = () => { if (!oyn) return; const t = ses.paused || ses.ended ? (performance.now() - bas) / 1000 : ses.currentTime; if (t >= SURE) { oyn = false; btn.textContent = '▶ Oynat'; return; } goster(t); requestAnimationFrame(dongu); };
    const baslat = () => { oyn = !oyn; btn.textContent = oyn ? '❚❚ Duraklat' : '▶ Oynat'; if (oyn) { const t = +kay.value; ses.currentTime = Math.min(t, ses.duration || t); bas = performance.now() - t * 1000; if (t < (ses.duration || 0)) ses.play().catch(() => {}); requestAnimationFrame(dongu); } else ses.pause(); };
    btn.onclick = baslat; document.onkeydown = e => { if (e.code === 'Space') { e.preventDefault(); baslat(); } };
    kay.oninput = () => { if (oyn) baslat(); goster(+kay.value); };
  })();
</script>
