/* ==========================================================================
   YARDIMCILAR
   ========================================================================== */
const W = 1920, H = 1080, TAU = Math.PI * 2;
const cv = document.getElementById('c'), c = cv.getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = k => k * k * (3 - 2 * k);
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const rgba = (c3, a) => `rgba(${c3[0]},${c3[1]},${c3[2]},${a})`;
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function poly(ctx, pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); ctx.fill(); }
function elips(ctx, x, y, rx, ry, a = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, a, 0, TAU); ctx.fill(); }
function kamera(ctx, cx, cy, z, sx = 0, sy = 0) { ctx.translate(W / 2 + sx, H / 2 + sy); ctx.scale(z, z); ctx.translate(-cx, -cy); }
function kamYol(t, keys) {
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 0; i < keys.length - 1; i++) { const a = keys[i], b = keys[i + 1]; if (t <= b[0]) { const k = eio(seg(t, a[0], b[0])); return a.slice(1).map((v, j) => lerp(v, b[j + 1], k)); } }
  return keys[keys.length - 1].slice(1);
}
function isik(ctx, x, y, r, renk, a) {
  if (a <= 0 || r <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(renk, a)); g.addColorStop(.35, rgba(renk, a * .45)); g.addColorStop(1, rgba(renk, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
}
function siyah(ctx, a) { if (a <= 0) return; ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(0,0,0,${clamp(a)})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }
function ton(ctx, renk, a) { if (a <= 0) return; ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = rgba(renk, a); ctx.fillRect(0, 0, W, H); ctx.restore(); }
// titreyen floresan: 1 = yanık, 0 = sönük
function floresan(t, tohum) { const r = rng(Math.floor(t * 9) + tohum * 1000)(); return r < .06 ? .15 : r < .1 ? .55 : 1; }

// Karanlık maskesi: ekranı karartır, ışık noktalarında delik açar (ekran koordinatı)
const MK = document.createElement('canvas'); MK.width = W; MK.height = H; const mk = MK.getContext('2d');
function karanlik(ctx, taban, isiklar) {
  mk.setTransform(1, 0, 0, 1, 0, 0); mk.globalCompositeOperation = 'source-over'; mk.clearRect(0, 0, W, H);
  mk.fillStyle = `rgba(0,0,0,${taban})`; mk.fillRect(0, 0, W, H);
  mk.setTransform(ctx.getTransform()); mk.globalCompositeOperation = 'destination-out';
  for (const l of isiklar) {
    if (!l || l.r <= 0) continue;
    const g = mk.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r);
    g.addColorStop(0, `rgba(0,0,0,${l.g})`); g.addColorStop(.45, `rgba(0,0,0,${l.g * .6})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    mk.fillStyle = g; mk.fillRect(l.x - l.r, l.y - l.r, l.r * 2, l.r * 2);
  }
  mk.setTransform(1, 0, 0, 1, 0, 0); mk.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(MK, 0, 0); ctx.restore();
}

/* ---------- Mini 3B kamera (sınıf ve koridor) ----------
   Dünya: metre. x sağa, y yukarı, z ileri (tahtaya doğru). yaw > 0 sağa döner, pitch > 0 yukarı bakar. */
const CAM = {};
function kamAyar(o) { Object.assign(CAM, { x: 0, y: 1.4, z: 0, yaw: 0, pitch: 0, f: 950, cx: 960, cy: 540 }, o); }
kamAyar({});
function kc(p) {
  const dx = p[0] - CAM.x, dy = p[1] - CAM.y, dz = p[2] - CAM.z, cy = Math.cos(CAM.yaw), sy = Math.sin(CAM.yaw);
  const x = cy * dx - sy * dz, z = sy * dx + cy * dz, cp = Math.cos(CAM.pitch), sp = Math.sin(CAM.pitch);
  return [x, cp * dy - sp * z, sp * dy + cp * z];
}
const ekran = k => [CAM.cx + CAM.f * k[0] / k[2], CAM.cy - CAM.f * k[1] / k[2]];
function pr(p) { const k = kc(p); if (k[2] < .05) return null; const e = ekran(k); return [e[0], e[1], k[2]]; }
function kesis(P, Q, n) { const k = (n - P[2]) / (Q[2] - P[2]); return [P[0] + (Q[0] - P[0]) * k, P[1] + (Q[1] - P[1]) * k, n]; }
function kirp(ps) { const n = .05, o = []; for (let i = 0; i < ps.length; i++) { const a = ps[i], b = ps[(i + 1) % ps.length], ai = a[2] >= n, bi = b[2] >= n; if (ai) o.push(a); if (ai !== bi) o.push(kesis(a, b, n)); } return o; }
function yol3(ctx, pts) { const k = kirp(pts.map(kc)); if (k.length < 3) return false; ctx.beginPath(); k.forEach((p, i) => { const e = ekran(p); i ? ctx.lineTo(e[0], e[1]) : ctx.moveTo(e[0], e[1]); }); ctx.closePath(); return true; }
function p3(ctx, pts, renk) { if (yol3(ctx, pts)) { ctx.fillStyle = renk; ctx.fill(); } }
function c3(ctx, a, b, renk, w) {
  let A = kc(a), B = kc(b); const n = .05; if (A[2] < n && B[2] < n) return;
  if (A[2] < n) A = kesis(A, B, n); else if (B[2] < n) B = kesis(B, A, n);
  const e1 = ekran(A), e2 = ekran(B); ctx.strokeStyle = renk; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(e1[0], e1[1]); ctx.lineTo(e2[0], e2[1]); ctx.stroke();
}
// Kutu: yalnızca kameraya bakan yüzleri çizer. r = {on (z0 yüzü), arka (z1), yan, ust, alt}
function kutu(ctx, x0, x1, y0, y1, z0, z1, r) {
  if (CAM.z < z0 && r.on) p3(ctx, [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]], r.on);
  if (CAM.z > z1 && r.arka) p3(ctx, [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], r.arka);
  if (CAM.x < x0 && r.yan) p3(ctx, [[x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0]], r.yan);
  if (CAM.x > x1 && r.yan) p3(ctx, [[x1, y0, z0], [x1, y0, z1], [x1, y1, z1], [x1, y1, z0]], r.yan);
  if (CAM.y > y1 && r.ust) p3(ctx, [[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], r.ust);
  if (CAM.y < y0 && r.alt) p3(ctx, [[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]], r.alt);
}
// Düzlemde 2B çizim: yerel (0,0)-(gw,gh) alanını üç köşeye eşler (afin yaklaşım)
function duzlem(ctx, TL, TR, BL, gw, gh, fn) {
  const a = pr(TL), b = pr(TR), d = pr(BL); if (!a || !b || !d) return;
  ctx.save(); ctx.setTransform((b[0] - a[0]) / gw, (b[1] - a[1]) / gw, (d[0] - a[0]) / gh, (d[1] - a[1]) / gh, a[0], a[1]); fn(ctx); ctx.restore();
}

/* ---------- Karakterler ---------- */
// Ayakta siluet. x,y = ayak ortası, h = boy (px)
function kisi(ctx, x, y, h, o = {}) {
  const s = h / 100; ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const ten = o.renk || '#06080b', govde = o.govde || ten, bacak = o.bacak || govde;
  const e = o.yasli ? 4 : 0, sw = o.adim !== undefined ? Math.sin(o.adim) * 5 : 0;
  ctx.fillStyle = bacak;
  poly(ctx, [[-9.5, -45], [-.8, -45], [-2.5 - sw, 0], [-10 - sw, 0]]);
  poly(ctx, [[.8, -45], [9.5, -45], [10 + sw, 0], [2.5 + sw, 0]]);
  ctx.fillStyle = govde;
  ctx.beginPath(); ctx.moveTo(-12.5, o.mont ? -30 : -42); ctx.bezierCurveTo(-16, -55, -15, -70, -11 + e, -80); ctx.quadraticCurveTo(e, -84, 11 + e, -80); ctx.bezierCurveTo(15, -70, 16, -55, 12.5, o.mont ? -30 : -42); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = govde; ctx.lineCap = 'round'; ctx.lineWidth = 6;
  const sol = o.solEl || [-15, -46], sag = o.sagEl || [15, -46];
  ctx.beginPath(); ctx.moveTo(-10 + e, -76); ctx.quadraticCurveTo(o.solEl ? (-10 + sol[0]) / 2 - 4 : -17, o.solEl ? (-76 + sol[1]) / 2 - 4 : -63, sol[0], sol[1]); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10 + e, -76); ctx.quadraticCurveTo(o.sagEl ? (10 + sag[0]) / 2 + 4 : 17, o.sagEl ? (-76 + sag[1]) / 2 - 4 : -63, sag[0], sag[1]); ctx.stroke();
  if (o.canta) { ctx.fillStyle = o.cantaRenk || '#0b0e13'; ctx.beginPath(); ctx.roundRect(-10, -77, 20, 27, 4); ctx.fill(); }
  const hy = o.yasli ? -87 : -89, hr = o.cocuk ? 1.12 : 1;
  ctx.fillStyle = ten; ctx.fillRect(-3 + e, -84, 6, 6);
  ctx.fillStyle = o.sacRenk || ten;
  if (o.sac === 'kuyruk') { ctx.beginPath(); ctx.moveTo(4 + e, hy - 7); ctx.quadraticCurveTo(15 + e, hy - 4, 13 + e, hy + 12); ctx.quadraticCurveTo(10 + e, hy + 6, 6 + e, hy + 1); ctx.closePath(); ctx.fill(); }
  if (o.sac === 'uzun') { ctx.beginPath(); ctx.moveTo(-8.5 * hr + e, hy - 2); ctx.bezierCurveTo(-12 + e, hy + 14, -11, hy + 22, -9, -62); ctx.lineTo(9, -62); ctx.bezierCurveTo(11, hy + 22, 12 + e, hy + 14, 8.5 * hr + e, hy - 2); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle = ten; elips(ctx, e, hy, 8 * hr, 9.5 * hr);
  if (o.yuz) { ctx.fillStyle = `rgba(150,145,135,${o.yuz * .3})`; elips(ctx, e + (o.yuzX || 0), hy + 1, 5.2 * hr * (o.yuzG || 1), 7 * hr); }
  ctx.restore();
}
// Oturan öğrenci (arkadan). x,y = oturak noktası, s = metre başına piksel
function oturan(ctx, x, y, s, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const g = o.govde || '#1d2530', sac = o.sac || '#0c0e10', ten = o.ten || '#2a2826';
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-.2, 0); ctx.bezierCurveTo(-.215, -.25, -.22, -.42, -.165, -.5); ctx.quadraticCurveTo(0, -.555, .165, -.5); ctx.bezierCurveTo(.22, -.42, .215, -.25, .2, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = ten; ctx.fillRect(-.032, -.585, .064, .1);
  const d = o.don || 0, hx = d * .012;
  ctx.fillStyle = sac;

    case 'silme': { const n = Math.max(1, Math.round(e.sure / .38)); for (let i = 0; i < n; i++) { const x = i * e.sure / n; if (x + .35 < ofs) continue; const tt = w + Math.max(0, x - ofs), s = gurultu(), f = filtre('bandpass', 700 + (i % 2) * 250, .9), g = kazanc(0, cik); s.connect(f); f.connect(g); g.gain.setValueAtTime(0, tt); g.gain.linearRampToValueAtTime(.34, tt + .12); g.gain.linearRampToValueAtTime(0, tt + .34); s.start(tt); s.stop(tt + .36); } break; }
    case 'zil': { yk.gain.value = .7; const g = kazanc(0, cik), bp = filtre('bandpass', 2000, 1.1); bp.connect(g);
      for (const fr of [1046, 1568, 2793]) { const o = izle(A.createOscillator()); o.type = 'square'; o.frequency.value = fr; o.connect(kazanc(fr > 2000 ? .25 : .5, bp)); o.start(w); o.stop(w + kalan + .3); }
      const l = izle(A.createOscillator()), lg = kazanc(.5); l.type = 'square'; l.frequency.value = 22; l.connect(lg); lg.connect(g.gain);
      g.gain.setValueAtTime(.5, w); g.gain.setValueAtTime(.5, w + Math.max(.01, kalan - .05)); g.gain.linearRampToValueAtTime(0, w + kalan + .25); l.start(w); l.stop(w + kalan + .3); break; }
    case 'floresan': { const g = kazanc(.03, cik); for (const [fr, a] of [[100, 1], [200, .5], [300, .25]]) { const o = izle(A.createOscillator()); o.frequency.value = fr; o.connect(kazanc(a, g)); o.start(w); o.stop(w + kalan); }
      const r = rng(Math.floor(e.t * 7)); for (let x = r() * 1.5; x < e.sure; x += .8 + r() * 2.2) { if (x < ofs) continue; patla(cik, w + x - ofs, 3200, .7, .07, .05, 'highpass'); patla(cik, w + x - ofs + .09, 3200, .7, .05, .04, 'highpass'); } break; }
    case 'adim': { const ar = e.aralik || .6; for (let x = Math.ceil(ofs / ar) * ar; x < e.sure; x += ar) { const tt = w + x - ofs;
        patla(cik, tt, e.kar ? 1500 : 420, .8, .5, e.kar ? .12 : .09, 'lowpass');
        if (!e.kar) { const o = izle(A.createOscillator()), g2 = kazanc(0, cik); o.frequency.value = 80; o.connect(g2); g2.gain.setValueAtTime(.3, tt); g2.gain.exponentialRampToValueAtTime(.001, tt + .1); o.start(tt); o.stop(tt + .12); }
        if (e.islak && Math.random() < .5) { const o = izle(A.createOscillator()), g3 = kazanc(0, cik); o.frequency.setValueAtTime(1300, tt + .03); o.frequency.linearRampToValueAtTime(950, tt + .1); o.connect(g3); g3.gain.setValueAtTime(0, tt + .03); g3.gain.linearRampToValueAtTime(.05, tt + .05); g3.gain.linearRampToValueAtTime(0, tt + .11); o.start(tt + .03); o.stop(tt + .12); } } break; }
    case 'kapi': { yk.gain.value = .5; patla(cik, w, 1500, 1, .5, .04, 'highpass');
      for (const [fr, q] of [[190, 7], [380, 12]]) { const o = izle(A.createOscillator()), f = filtre('bandpass', fr * 3.5, q), g = kazanc(0, cik); o.type = 'sawtooth'; o.frequency.setValueAtTime(fr, w + .1); o.frequency.linearRampToValueAtTime(fr * .72, w + .8); o.frequency.linearRampToValueAtTime(fr * .85, w + 1.4); o.connect(f); f.connect(g); g.gain.setValueAtTime(0, w + .1); g.gain.linearRampToValueAtTime(.3, w + .25); g.gain.setValueAtTime(.26, w + 1.1); g.gain.linearRampToValueAtTime(0, w + 1.5); o.start(w + .1); o.stop(w + 1.6); } break; }
    case 'ugultu': case 'cocuklar': { const g = kazanc(0, cik), r = rng(Math.floor(e.t * 13));
      for (let i = 0; i < 7; i++) { const s = gurultu(), f = filtre('bandpass', 300 + r() * 1000, 3 + r() * 3), sg = kazanc(.5, g); s.connect(f); f.connect(sg); const l = izle(A.createOscillator()), lg = kazanc(.5); l.frequency.value = 2 + r() * 5; l.connect(lg); lg.connect(sg.gain); s.start(w); s.stop(w + kalan + .1); l.start(w); l.stop(w + kalan + .1); }
      g.gain.setValueAtTime(ofs > 0 ? .5 : 0, w); g.gain.linearRampToValueAtTime(.5, w + .3);
      if (e.tip === 'cocuklar') g.gain.linearRampToValueAtTime(0, w + kalan); else { g.gain.setValueAtTime(.5, w + Math.max(.3, kalan - .5)); g.gain.linearRampToValueAtTime(0, w + kalan); }
      break; }
    case 'yuvarlan': { const s = gurultu(), f = filtre('bandpass', 1300, 2), g = kazanc(0, cik); s.connect(f); f.connect(g); const l = izle(A.createOscillator()), lg = kazanc(.12); l.type = 'square'; l.frequency.setValueAtTime(20, w); l.frequency.linearRampToValueAtTime(6, w + kalan); l.connect(lg); lg.connect(g.gain); g.gain.setValueAtTime(.14, w); g.gain.linearRampToValueAtTime(0, w + kalan); s.start(w); s.stop(w + kalan + .05); l.start(w); l.stop(w + kalan + .05); break; }
    case 'stinger': { yk.gain.value = .9; const o = izle(A.createOscillator()), g = kazanc(0, cik); o.frequency.setValueAtTime(80, w); o.frequency.exponentialRampToValueAtTime(35, w + .8); o.connect(g); g.gain.setValueAtTime(.9, w); g.gain.exponentialRampToValueAtTime(.001, w + 1.4); o.start(w); o.stop(w + 1.5);
      const hp = filtre('highpass', 600), g2 = kazanc(0, cik); hp.connect(g2); for (const fr of [740, 784, 1109, 1175]) { const o2 = izle(A.createOscillator()); o2.type = 'sawtooth'; o2.frequency.value = fr; o2.connect(hp); o2.start(w); o2.stop(w + 1.6); }
      g2.gain.setValueAtTime(0, w); g2.gain.linearRampToValueAtTime(.07, w + .02); g2.gain.exponentialRampToValueAtTime(.001, w + 1.5); patla(cik, w, 2000, .7, .5, .25, 'lowpass'); break; }
    case 'servis': { for (const [x0, d] of [[0, 3.5], [3.2, 4]]) { if (x0 + d < ofs) continue; const tt = w + Math.max(0, x0 - ofs);
        const o = izle(A.createOscillator()), f = filtre('lowpass', 260), g = kazanc(0, cik); o.type = 'sawtooth'; o.frequency.setValueAtTime(42, tt); o.frequency.linearRampToValueAtTime(55, tt + d); o.connect(f); f.connect(g); g.gain.setValueAtTime(0, tt); g.gain.linearRampToValueAtTime(.3, tt + d * .45); g.gain.linearRampToValueAtTime(0, tt + d); o.start(tt); o.stop(tt + d + .05);
        const s = gurultu(), f2 = filtre('bandpass', 700, .8), g2 = kazanc(0, cik); s.connect(f2); f2.connect(g2); g2.gain.setValueAtTime(0, tt); g2.gain.linearRampToValueAtTime(.35, tt + d * .5); g2.gain.linearRampToValueAtTime(0, tt + d); s.start(tt); s.stop(tt + d + .05); } break; }
    case 'sandalye': { yk.gain.value = .5; const d = Math.max(.1, kalan), s = gurultu(), f = filtre('bandpass', 900, 4), g = kazanc(0, cik); s.connect(f); f.connect(g); const l = izle(A.createOscillator()), lg = kazanc(.25); l.type = 'sawtooth'; l.frequency.setValueAtTime(28, w); l.frequency.linearRampToValueAtTime(45, w + d); l.connect(lg); lg.connect(g.gain);
      g.gain.setValueAtTime(0, w); g.gain.linearRampToValueAtTime(.35, w + Math.min(.15, d / 3)); g.gain.setValueAtTime(.3, w + Math.max(d * .5, d - .3)); g.gain.linearRampToValueAtTime(0, w + d); s.start(w); s.stop(w + d + .05); l.start(w); l.stop(w + d + .05);
      const o = izle(A.createOscillator()), f2 = filtre('bandpass', 520, 10), g2 = kazanc(0, cik); o.type = 'sawtooth'; o.frequency.setValueAtTime(170, w); o.frequency.linearRampToValueAtTime(130, w + d); o.connect(f2); f2.connect(g2); g2.gain.setValueAtTime(0, w); g2.gain.linearRampToValueAtTime(.15, w + Math.min(.3, d / 2)); g2.gain.linearRampToValueAtTime(0, w + d); o.start(w); o.stop(w + d + .05); break; }
    case 'drone': { const f = filtre('lowpass', 240), g = kazanc(0, cik); f.connect(g); const g0 = .05 + .4 * ofs / e.sure;
      for (const fr of [55, 55.7, 27.5]) { const o = izle(A.createOscillator()); o.type = fr < 30 ? 'sine' : 'sawtooth'; o.frequency.value = fr; o.connect(f); o.start(w); o.stop(w + kalan); }
      const hi = izle(A.createOscillator()), hg = kazanc(.012, cik); hi.frequency.value = 1244; hi.connect(hg); hi.start(w); hi.stop(w + kalan);
      g.gain.setValueAtTime(g0, w); g.gain.linearRampToValueAtTime(.45, w + kalan - .03); g.gain.linearRampToValueAtTime(0, w + kalan); break; }
  }
}
function replikCal(r, w, ofs) {
  const b = SES.tampon[r.id]; if (!b) return;
  const A = SES.A, S = r.efekt === 'S', hiz = S ? .95 : 1;
  if (ofs >= b.duration / hiz) return;
  const pan = A.createStereoPanner(); pan.pan.value = r.pan || 0; pan.connect(SES.ana);
  const g = kazanc(AYAR.diyalogSes * (r.ses ?? 1), pan);
  const s = izle(A.createBufferSource()); s.buffer = b; s.playbackRate.value = hiz;
  if (S) {
    const lp = filtre('lowpass', 2600); s.connect(lp); lp.connect(g); g.connect(kazanc(.8, SES.yanki));
    const s2 = izle(A.createBufferSource()); s2.buffer = b; s2.playbackRate.value = hiz; const lp2 = filtre('lowpass', 1400), g2 = kazanc(.22, pan); s2.connect(lp2); lp2.connect(g2); s2.start(w + .14, ofs * hiz);
  } else { s.connect(g); g.connect(kazanc(.06, SES.yanki)); }
  s.start(w, ofs * hiz);
}
function hepsiniPlanla(ofs) {
  const now = SES.A.currentTime + .05;
  for (const e of AYAR.efektler) { const son = e.t + (e.sure || 4); if (son <= ofs) continue; efektCal(e, now + Math.max(0, e.t - ofs), Math.max(0, ofs - e.t)); }
  for (const r of AYAR.replikler) { if (r.t + 30 <= ofs) continue; replikCal(r, now + Math.max(0, r.t - ofs), Math.max(0, ofs - r.t)); }
  return now;
}
function hepsiniDurdur() { for (const n of SES.aktif) { try { n.stop(); } catch (e) { } } SES.aktif = []; }

/* ---------- Ses dosyaları ---------- */
SES.bekleyen = {};
function cozVeKaydet(id, arr) {
  if (!SES.A) { SES.bekleyen[id] = arr; return Promise.resolve(); }
  return SES.A.decodeAudioData(arr.slice(0)).then(b => { SES.tampon[id] = b; delete SES.bekleyen[id]; durumGuncelle(); }).catch(() => { });
}
function durumGuncelle() {
  const n = Object.keys(SES.tampon).length + Object.keys(SES.bekleyen).length;
  const el = document.getElementById('durum');
  if (n) el.innerHTML = `<b>${n} / ${AYAR.replikler.length}</b> diyalog sesi yüklendi. Eksik olanlar altyazı olarak görünür.`;
}
async function klasordenYukle() {
  if (location.protocol === "file:") return;
  await Promise.all(AYAR.replikler.map(async r => { try { const res = await fetch(`${AYAR.sesKlasoru}/${r.dosya}`); if (res.ok) { SES.bekleyen[r.id] = await res.arrayBuffer(); } } catch (e) { } }));
  durumGuncelle();
}
document.getElementById('sesDosya').addEventListener('change', async ev => {
  for (const f of ev.target.files) { const m = f.name.toUpperCase().match(/R(\d{2})/); if (!m) continue; const id = 'R' + m[1]; if (!AYAR.replikler.find(r => r.id === id)) continue; const arr = await f.arrayBuffer(); sesBaslat(); await cozVeKaydet(id, arr); }
  durumGuncelle(); if (oynuyor) { const t = simdi(); dur(); oynat(t); }
});

/* ==========================================================================
   OYNATICI
   ========================================================================== */
let oynuyor = false, basOfs = 0, basZaman = 0, kayitci = null;
const btn = document.getElementById('oynat'), bar = document.getElementById('ilerleme'), zEl = document.getElementById('zaman');
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function simdi() { return oynuyor ? basOfs + (SES.A.currentTime - basZaman) : basOfs; }
function oynat(ofs = basOfs) {
  sesBaslat(); SES.A.resume(); if (ofs >= AYAR.sure - .05) ofs = 0;
  hepsiniDurdur(); basOfs = ofs; basZaman = hepsiniPlanla(ofs); oynuyor = true; btn.textContent = '⏸ Duraklat';
  document.getElementById('baslat').style.display = 'none';
}
function dur() { if (!oynuyor) return; basOfs = simdi(); oynuyor = false; hepsiniDurdur(); btn.textContent = '▶ Oynat'; }
function dongu() {
  let t = simdi();
  if (oynuyor && t >= AYAR.sure) { dur(); basOfs = AYAR.sure; t = AYAR.sure; if (kayitci) kayitci.stop(); }
  cizim(Math.max(0, t));
  if (!bar.matches(':active')) bar.value = t; zEl.textContent = `${fmt(t)} / ${fmt(AYAR.sure)}`;
  requestAnimationFrame(dongu);
}
btn.onclick = () => oynuyor ? dur() : oynat();
document.getElementById('baslat').onclick = () => oynat(0);
bar.oninput = () => { const v = +bar.value; if (oynuyor) { hepsiniDurdur(); oynat(v); } else basOfs = v; };
document.getElementById('altyaziKutu').onchange = e => AYAR.altyazi = e.target.checked;
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); oynuyor ? dur() : oynat(); } });
document.getElementById('kaydet').onclick = () => {
  if (kayitci) return; sesBaslat();
  const akis = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...SES.kayitHedef.stream.getAudioTracks()]);
  const tip = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'].find(m => MediaRecorder.isTypeSupported(m)) || '';
  const parca = []; kayitci = new MediaRecorder(akis, { mimeType: tip, videoBitsPerSecond: 12e6 });
  kayitci.ondataavailable = e => e.data.size && parca.push(e.data);
  kayitci.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(parca, { type: tip || 'video/webm' })); a.download = 'KaraTahta_Bolum1.' + (tip.includes('mp4') ? 'mp4' : 'webm'); a.click(); kayitci = null; document.getElementById('kaydet').textContent = '🎬 Video Kaydet'; };
  document.getElementById('kaydet').textContent = '⏺ Kaydediliyor… (2:00)'; kayitci.start(); oynat(0);
};

// ?t=SANIYE → o kareyi göster (kontrol için), ?altyazi=0 → altyazısız
const q = new URLSearchParams(location.search);
if (q.get('altyazi') === '0') { AYAR.altyazi = false; document.getElementById('altyaziKutu').checked = false; }
if (q.has('t')) { basOfs = +q.get('t'); document.getElementById('baslat').style.display = 'none'; }
klasordenYukle();
hazirla().then(() => requestAnimationFrame(dongu));
</script>
