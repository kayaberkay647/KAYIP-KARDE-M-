<style>

<script>
/* ==========================================================================

const GORSEL = {

const MIKS = { diyalog: 1.4, muzik: 0.42, muzikKisma: 0.62 };   // fon müziği konuşurken hafifçe kısılır

function bulanik(src, px) { return katman(src.width, src.height, g => { g.filter = `blur(${px}px)`; g.drawImage(src, 0, 0); }); }

/* ==========================================================================

const PAKET = window.SES_PAKETI || { sahneler: {}, efektler: {}, muzik: null };
const SAHNELER = BOLUM.sahneler, L = [];
SAHNELER.forEach((s, si) => s.replikler.forEach((r, ri) => { r.sahne = s; r.si = si; r.ri = ri; L.push(r); }));

    s.replikler.forEach((r, i) => {
      const g = P && P.satirlar.find(x => x.id === r.id);
      // kesBas/kesSon: replikler arasındaki gerçek sessizlik noktaları (kelime asla bölünmez); sesSon: konuşmanın bittiği an
      if (g) { r.segBas = g.kesBas; r.parca = g.kesSon - g.kesBas; r.konus = Math.max(.3, g.sesSon - g.kesBas); r.kelime = g.kelime; r.bitisik = !!g.bitisik; }
      else { r.segBas = null; r.konus = Math.max(1.2, r.metin.length * .065); r.parca = r.konus + .12; r.kelime = null; }
    });

  const dogal = L.reduce((a, r) => a + r.parca, 0) + taban.reduce((a, b) => a + b, 0) + GORSEL.sonYaziSure;
  let fazla = BOLUM.hedefSure - dogal; const ek = L.map(() => 0);

  L.forEach(r => {
    PLANLAR.push({ t: r.ri === 0 ? r.gapBas : r.bas - Math.min(.22, r.bosluk * .5), plan: r.plan, s: r.sahne });
    for (const e of r.ek || []) PLANLAR.push({ t: r.bas + r.konus * e.f, plan: e.plan, s: r.sahne });
  });
  PLANLAR.sort((a, b) => a.t - b.t);
  OLAY = { duygu: {}, poz: {} };
  for (const k of Object.keys(BOLUM.karakterler)) { OLAY.duygu[k] = []; OLAY.poz[k] = []; }
  L.forEach(r => { const te = r.ri === 0 ? r.gapBas : r.bas - .2;
    for (const [k, v] of Object.entries(r.duygu || {})) OLAY.duygu[k].push([te, v]);
    for (const [k, v] of Object.entries(r.poz || {})) OLAY.poz[k].push([te, v]); });
  document.getElementById('ilerleme').max = TOPLAM;
}
zamanla();
function cizgi(liste, t, vars, sure = .35) { let o = vars, cr = vars, tc = -99; for (const [tt, v] of liste) { if (tt <= t) { o = cr; cr = v; tc = tt; } else break; } return [o, cr, ss(clamp((t - tc) / sure))]; }

/* ---------- ses çözümleme + ağız hareketi ---------- */
const TAMPON = { sahne: {}, efekt: {}, muzik: null }, ZARF = {};
const HAZIR = (async () => {
  try { await document.fonts.load('700 60px Kalam', 'ğüşıöçĞÜŞİÖÇ'); } catch (e) { }
  if (!window.SES_PAKETI) return;
  const dc = new OfflineAudioContext(2, 1, 44100);
  const coz = async b64 => { const u = Uint8Array.from(atob(b64), ch => ch.charCodeAt(0)); return dc.decodeAudioData(u.buffer); };
  for (const [id, v] of Object.entries(PAKET.sahneler)) {
    const b = await coz(v.veri); TAMPON.sahne[id] = b;
    const d = b.getChannelData(0), adim = Math.floor(b.sampleRate / 60), n = Math.ceil(d.length / adim), rms = new Float32Array(n);
    for (let i = 0; i < n; i++) { let s = 0; const a = i * adim, e = Math.min(d.length, a + adim); for (let j = a; j < e; j++) s += d[j] * d[j]; rms[i] = Math.sqrt(s / Math.max(1, e - a)); }
    const p = Array.from(rms).sort((x, y) => x - y)[Math.floor(n * .95)] || 1, ac = new Float32Array(n); let v2 = 0;
    for (let i = 0; i < n; i++) { const h = clamp((rms[i] / p - .1) / .7); v2 = h > v2 ? lerp(v2, h, .7) : lerp(v2, h, .35); ac[i] = v2; }
    ZARF[id] = ac;
  }
  // her repliğin seviyesini eşitle (fısıltılar yükseltilir, bağırışlar biraz indirilir)
  const sv = []; for (const r of L) { const b = TAMPON.sahne[r.sahne.id]; if (!b || r.segBas == null) continue; const d = b.getChannelData(0), a = Math.floor(r.segBas * b.sampleRate), e = Math.min(d.length, Math.floor((r.segBas + r.konus) * b.sampleRate)); let q = 0, n = 0; for (let i = a; i < e; i++) { const x = d[i]; if (Math.abs(x) > .01) { q += x * x; n++; } } r._rms = Math.sqrt(q / Math.max(1, n)); sv.push(r._rms); }
  const orta = sv.sort((x, y) => x - y)[Math.floor(sv.length / 2)] || 1; for (const r of L) r._kazanc = r._rms ? clamp(orta / r._rms, .75, 3.6) : 1;
  for (const [ad, v] of Object.entries(PAKET.efektler || {})) TAMPON.efekt[ad] = await coz(v.veri);

  zamanla();
})();
function agizAc(id, t) {
  const r = aktifReplik(t); if (!r || r.kim !== id) return 0;
  const lt = t - r.bas, Z = ZARF[r.sahne.id];
  if (!Z || r.segBas == null) return clamp(.5 + .5 * Math.sin(lt * 15) * Math.sin(lt * 4.7));
  return Z[Math.min(Z.length - 1, Math.max(0, Math.floor((r.segBas + lt) * 60)))] || 0;
}
const kirp = (id, t) => { const p = 3.4 + (id.charCodeAt(1) % 5) * .45, l = (t + id.charCodeAt(0) * .41) % p; return l < .14 ? Math.sin(l / .14 * Math.PI) : 0; };

   ========================================================================== */

  cocuk:    { basY: -536, rx: 80, ry: 94,  omuzY: -430, omuzW: 70,  nw: 16, belY: -272, belW: 64, kalcaY: -262, bacakW: 30, kolW: 25, elR: 15.5, otur: 118 },
};

  KEREM: { tip: 'yetiskin', ten: '#e2b48f', sac: '#241b17', sacAcik: '#4d3d35', sacTip: 'kisa', iris: '#4a301f', allik: .14, sakal: true },

function oynat(ofs = basOfs) { sesBaslat(); SES.A.resume(); if (ofs >= TOPLAM - .05) ofs = 0; hepsiniDurdur(); basOfs = ofs; basZaman = hepsiniPlanla(ofs); oynuyor = true; btn.textContent = '⏸ Duraklat'; document.getElementById('baslat').style.display = 'none'; }
function dur() { if (!oynuyor) return; basOfs = simdi(); oynuyor = false; hepsiniDurdur(); btn.textContent = '▶ Oynat'; }
function dongu() { let t = simdi(); if (oynuyor && t >= TOPLAM) { dur(); basOfs = TOPLAM; t = TOPLAM; if (kayitci) kayitci.stop(); } cizim(Math.max(0, t)); if (!bar.matches(':active')) bar.value = t; zEl.textContent = `${fmt(t)} / ${fmt(TOPLAM)}`; requestAnimationFrame(dongu); }
btn.onclick = () => oynuyor ? dur() : HAZIR.then(() => oynat());
document.getElementById('baslat').onclick = () => HAZIR.then(() => oynat(0));
bar.oninput = () => { const v = +bar.value; if (oynuyor) oynat(v); else basOfs = v; };
document.getElementById('altyaziKutu').onchange = e => ALTYAZI = e.target.checked;
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); oynuyor ? dur() : HAZIR.then(() => oynat()); } });
document.getElementById('kaydet').onclick = async () => {
  if (kayitci) return; await HAZIR; sesBaslat();
  const akis = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...SES.kayit.stream.getAudioTracks()]);
  const tip = ['video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m)) || '';
  const parca = []; kayitci = new MediaRecorder(akis, { mimeType: tip, videoBitsPerSecond: 10e6 });
  kayitci.ondataavailable = e => e.data.size && parca.push(e.data);
  kayitci.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(parca, { type: tip })); a.download = 'BuCocukSizinDegil_Bolum11.' + (tip.includes('mp4') ? 'mp4' : 'webm'); a.click(); kayitci = null; document.getElementById('kaydet').textContent = '🎬 Video Kaydet'; };
  document.getElementById('kaydet').textContent = '⏺ Kaydediliyor…'; kayitci.start(); oynat(0);
};
const q = new URLSearchParams(location.search);
if (q.get('altyazi') === '0') { ALTYAZI = false; document.getElementById('altyaziKutu').checked = false; }
if (q.has('t')) { basOfs = +q.get('t'); document.getElementById('baslat').style.display = 'none'; }
HAZIR.then(() => { document.getElementById('durum').textContent = window.SES_PAKETI ? `Sesler hazır · Süre ${fmt(TOPLAM)}` : 'Ses paketi yok: önce "node ses_uret.js" çalıştır.'; });
window.HAZIR = HAZIR; window.TOPLAM_SURE = () => TOPLAM;
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(dongu));
</script>
