<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">

<title>Bu Çocuk Sizin Değil – Bölüm 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

            background:rgba(10,8,7,.7); cursor:pointer; }
  #baslat b { font-family:"Playfair Display",serif; font-size:clamp(22px,5vh,44px); }
  #baslat span { color:var(--soft); font-size:clamp(13px,2vh,17px); }

</div>

  <input id="ilerleme" type="range" min="0" max="150" step="0.01" value="0">

</div>
<script src="bolum1.js"></script>
<script src="ses_paketi.js" onerror="window.SES_PAKETI={sure:{},veri:{}}"></script>
<script>
/* ==========================================================================
   YARDIMCILAR
   ========================================================================== */
const W = 1080, H = 1920, TAU = Math.PI * 2, OL = '#3b2a25';
const cv = document.getElementById('c'), c = cv.getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function fs(ctx, fill, lw = 5, stroke = OL) { if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } }
function poly(ctx, pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); }
function katman(w, h, fn) { const k = document.createElement('canvas'); k.width = w; k.height = h; fn(k.getContext('2d')); return k; }
function yazi(ctx, s, x, y, font, renk, hiza = 'center') { ctx.font = font; ctx.fillStyle = renk; ctx.textAlign = hiza; ctx.fillText(s, x, y); }

/* ==========================================================================
   ZAMANLAMA — seslerin gerçek süresine göre otomatik
   ========================================================================== */
const PAKET = window.SES_PAKETI || { sure: {}, veri: {} };
const L = BOLUM.replikler;
let TOPLAM = 150, PLANLAR = [], SONKART = 0;
function zamanla() {
  const tahmin = r => PAKET.sure[r.id] || Math.max(1.6, r.metin.length * 0.075);
  const sureler = L.map(tahmin), bosluk = L.map(r => r.once ?? 0.4);
  const dogal = sureler.reduce((a, b) => a + b, 0) + bosluk.reduce((a, b) => a + b, 0) + BOLUM.sonKartSure;
  const agr = L.map((r, i) => i === 0 ? 0 : (r.vurgu ?? 0.3)), fazla = Math.max(0, BOLUM.hedefSure - dogal), agirlik = agr.reduce((a, b) => a + b, 0);
  let t = 0;
  L.forEach((r, i) => { const b = bosluk[i] + fazla * agr[i] / agirlik; /* ilk replik hemen başlar */ r._bosluk = b; t += b; r.bas = t; r.sure = sureler[i]; r.bit = t + r.sure; t = r.bit; });
  SONKART = t + 0.5; TOPLAM = SONKART + BOLUM.sonKartSure;
  PLANLAR = [];
  L.forEach((r, i) => {
    const kes = r.kurulum && i ? L[i - 1].bit + 0.5 : r.bas - Math.min(0.35, r._bosluk * 0.5);
    if (r.oncePlan) PLANLAR.push({ t: (i ? L[i - 1].bit : 0) + 0.25, plan: r.oncePlan });
    PLANLAR.push({ t: i === 0 ? 0 : kes, plan: r.plan });
    for (const e of r.ek || []) PLANLAR.push({ t: r.bas + r.sure * e.f, plan: e.plan });
  });
  PLANLAR.push({ t: SONKART, plan: 'sonKart' });
  PLANLAR.sort((a, b) => a.t - b.t);
  document.getElementById('ilerleme').max = TOPLAM;
}
zamanla();
function anlikPlan(t) { let p = PLANLAR[0], onceki = null; for (const x of PLANLAR) { if (x.t <= t) { onceki = p; p = x; } else break; } return { p, onceki }; }
function duygular(t) {
  const d = { SELIN: 'notr', DEFNE: 'notr', MURAT: 'notr', KEMAL: 'ciddi' };
  for (const r of L) { if (r.bas - 0.3 > t) break; Object.assign(d, r.duygu || {}); }
  return d;
}
function konusan(t) { for (const r of L) if (t >= r.bas && t < r.bit) return r; return null; }

/* ---------- Dudak senkronu: ses zarfı ---------- */
const ZARF = {}, TAMPON = {};
const HAZIR = (async () => {
  const ids = Object.keys(PAKET.veri);
  if (!ids.length) return;
  const dc = new OfflineAudioContext(1, 44100, 44100);
  for (const id of ids) {
    try {
      const u = Uint8Array.from(atob(PAKET.veri[id]), ch => ch.charCodeAt(0));
      const b = await dc.decodeAudioData(u.buffer); TAMPON[id] = b;
      const d = b.getChannelData(0), adim = Math.floor(b.sampleRate / 60), n = Math.ceil(d.length / adim), rms = new Float32Array(n);
      for (let i = 0; i < n; i++) { let s = 0; const a = i * adim, e = Math.min(d.length, a + adim); for (let j = a; j < e; j++) s += d[j] * d[j]; rms[i] = Math.sqrt(s / Math.max(1, e - a)); }
      const sirali = Array.from(rms).sort((x, y) => x - y), p = sirali[Math.floor(n * .95)] || 1;
      const z = new Float32Array(n); let v = 0;
      for (let i = 0; i < n; i++) { const h = clamp((rms[i] / p - .1) / .7); v = h > v ? lerp(v, h, .7) : lerp(v, h, .35); z[i] = v; }
      ZARF[id] = z;
    } catch (e) { console.warn('ses çözülemedi', id, e); }
  }
})();
function agizAc(id, t) {
  const r = konusan(t); if (!r || r.kim !== id) return 0;
  const z = ZARF[r.id]; const lt = t - r.bas;
  if (!z) return clamp(.5 + .5 * Math.sin(lt * 17) * Math.sin(lt * 5.3));
  return z[Math.min(z.length - 1, Math.floor(lt * 60))] || 0;
}
const kirp = (id, t) => { const p = 3.1 + (id.charCodeAt(1) % 4) * .55, l = (t + id.charCodeAt(0) * .37) % p; return l < .14 ? Math.sin(l / .14 * Math.PI) : 0; };

/* ==========================================================================
   KARAKTERLER
   ========================================================================== */
const KAR = {
  SELIN: { ten: '#f3c9a8', golge: '#e3ac8b', sac: '#4b2c20', sacKoyu: '#33190f', sacTip: 'uzun', iris: '#6a4328', ust: '#b6644a', ust2: '#9a523b', ic: '#f5ead9', alt: '#3f4661', allik: .3, kirpik: true },
  DEFNE: { ten: '#f7d3b5', golge: '#e9b998', sac: '#8b5633', sacKoyu: '#5e391f', sacTip: 'orgu', iris: '#4f7396', ust: '#f2c14b', ust2: '#d8a52f', ic: '#ffffff', alt: '#5b7fa8', allik: .45, cocuk: true, kirpik: true },
  MURAT: { ten: '#e6b691', golge: '#d29c77', sac: '#211b1a', sacKoyu: '#151110', sacTip: 'kisa', iris: '#3f2a1d', ust: '#2f4a6b', ust2: '#243b57', alt: '#55595f', allik: .1, sakal: true, kolTen: true },
  KEMAL: { ten: '#eac0a0', golge: '#d7a786', sac: '#c8c4bd', sacKoyu: '#8f8b85', sacTip: 'kel', iris: '#4b3a2b', ust: '#f4f6f7', ust2: '#d9dfe3', ic: '#a9c7df', kravat: '#7c3a3a', alt: '#4a4d55', allik: .14, gozluk: true, biyik: true },
};
const KAS = { notr: [0, 0], gulumse: [-2, 0], uzgun: [-9, 3], aglama: [-11, 3], sok: [-14, -12], endise: [-8, -2], ciddi: [4, -1], sakin: [0, 1], aci: [7, -3], uyku: [2, 2], zorGulumse: [-7, 2] };

function basYolu(ctx) { ctx.beginPath(); ctx.moveTo(-80, -10); ctx.bezierCurveTo(-82, -120, 82, -120, 80, -10); ctx.bezierCurveTo(80, 48, 42, 97, 0, 99); ctx.bezierCurveTo(-42, 97, -80, 48, -80, -10); ctx.closePath(); }

function kar(ctx, id, x, y, s, st = {}) {
  const K = KAR[id], ch = !!K.cocuk;
  const hy = ch ? -262 : -330, sy = ch ? -166 : -212, hs = ch ? .97 : 1, sw = ch ? 80 : 110, ww = ch ? 74 : 102;
  const t = st.t || 0, a = st.agiz || 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s * (1 + Math.sin(t * 1.6 + id.length) * .005));
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (st.bacak) bacaklar(ctx, K, ww, st.oturuyor);
  const egim = (st.egim || 0) + Math.sin(t * 2.7) * .02 * a;
  const basDon = (fn) => { ctx.save(); ctx.translate(0, sy - 20); ctx.rotate(egim); ctx.translate(0, -(sy - 20) - a * 3); fn(); ctx.restore(); };
  basDon(() => arkaSac(ctx, K, hy, hs));
  // boyun
  ctx.fillStyle = K.ten; ctx.fillRect(-21, hy + 70, 42, sy - hy - 60);
  ctx.fillStyle = K.golge; ctx.fillRect(-21, hy + 80, 42, 22);
  ctx.strokeStyle = OL; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-21, hy + 80); ctx.lineTo(-21, sy + 6); ctx.moveTo(21, hy + 80); ctx.lineTo(21, sy + 6); ctx.stroke();
  govde(ctx, id, K, sy, sw, ww);
  const kolSol = st.kolSol || 'yan', kolSag = st.kolSag || 'yan', onde = p => p === 'kulak' || p === 'agiz';
  if (!onde(kolSol)) kol(ctx, K, -1, kolSol, sy, sw, hy);
  if (!onde(kolSag)) kol(ctx, K, 1, kolSag, sy, sw, hy);
  basDon(() => bas(ctx, id, K, st, hy, hs));
  if (onde(kolSol)) kol(ctx, K, -1, kolSol, sy, sw, hy);
  if (onde(kolSag)) kol(ctx, K, 1, kolSag, sy, sw, hy);
  if (st.telefon) { const p = [42, sy + 70]; ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(-.2); rr(ctx, -26, -48, 52, 92, 9); fs(ctx, '#1b1d22', 4); rr(ctx, -21, -42, 42, 78, 6); ctx.fillStyle = st.telefon > .5 ? '#cfe6ff' : '#2a3140'; ctx.fill(); ctx.restore(); }
  ctx.restore();
}
function bacaklar(ctx, K, ww, otur) {
  ctx.fillStyle = K.alt;
  if (!otur) {
    poly(ctx, [[-ww + 8, 0], [-6, 0], [-10, 290], [-ww + 14, 290]]); fs(ctx, K.alt);
    poly(ctx, [[6, 0], [ww - 8, 0], [ww - 14, 290], [10, 290]]); fs(ctx, K.alt);
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * (ww / 2 + 2), 300, 40, 16, 0, 0, TAU); fs(ctx, '#3a2e2a', 4); }
  } else {
    poly(ctx, [[-ww + 4, 0], [ww - 4, 0], [ww + 8, 70], [-ww - 8, 70]]); fs(ctx, K.alt);
    poly(ctx, [[-ww + 4, 66], [-12, 66], [-14, 215], [-ww + 8, 215]]); fs(ctx, K.alt);
    poly(ctx, [[12, 66], [ww - 4, 66], [ww - 8, 215], [14, 215]]); fs(ctx, K.alt);
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * (ww / 2 + 4), 222, 36, 14, 0, 0, TAU); fs(ctx, '#3a2e2a', 4); }
  }
}
function govde(ctx, id, K, sy, sw, ww) {
  ctx.beginPath(); ctx.moveTo(-sw + 18, sy); ctx.quadraticCurveTo(-sw - 6, sy + 4, -sw - 4, sy + 42); ctx.lineTo(-ww, 70); ctx.lineTo(ww, 70); ctx.lineTo(sw + 4, sy + 42); ctx.quadraticCurveTo(sw + 6, sy + 4, sw - 18, sy); ctx.closePath();
  fs(ctx, K.ust);
  ctx.save(); ctx.clip(); ctx.fillStyle = K.ust2; ctx.globalAlpha = .55; ctx.fillRect(sw * .45, sy, sw, 300); ctx.restore();
  if (id === 'SELIN') {
    poly(ctx, [[-36, sy], [36, sy], [15, 70], [-15, 70]]); fs(ctx, K.ic, 4);
    ctx.fillStyle = '#7e3b29'; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(-24 + i * 3, sy + 70 + i * 55, 5, 0, TAU); ctx.fill(); }
    ctx.strokeStyle = '#d9c9b3'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-20, sy + 2); ctx.quadraticCurveTo(0, sy + 26, 20, sy + 2); ctx.stroke();
  } else if (id === 'DEFNE') {
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * 19, sy + 9, 23, 14, sx * .25, 0, TAU); fs(ctx, '#fff', 4); }
    ctx.fillStyle = '#e46a6a'; ctx.beginPath(); const hx = 30, hy2 = sy + 78; ctx.moveTo(hx, hy2 + 10); ctx.bezierCurveTo(hx - 16, hy2 - 2, hx - 8, hy2 - 14, hx, hy2 - 4); ctx.bezierCurveTo(hx + 8, hy2 - 14, hx + 16, hy2 - 2, hx, hy2 + 10); ctx.fill();
  } else if (id === 'MURAT') {
    poly(ctx, [[-15, sy], [15, sy], [0, sy + 30]]); fs(ctx, K.ten, 3);
    poly(ctx, [[-30, sy - 6], [0, sy + 32], [-38, sy + 26]]); fs(ctx, K.ust2, 4);
    poly(ctx, [[30, sy - 6], [0, sy + 32], [38, sy + 26]]); fs(ctx, K.ust2, 4);
    ctx.strokeStyle = OL; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, sy + 32); ctx.lineTo(0, 70); ctx.stroke();
    ctx.fillStyle = '#cfd6de'; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(7, sy + 62 + i * 52, 4.5, 0, TAU); ctx.fill(); }
  } else if (id === 'KEMAL') {
    poly(ctx, [[-40, sy], [40, sy], [0, sy + 112]]); fs(ctx, K.ic, 4);
    poly(ctx, [[-9, sy + 8], [9, sy + 8], [12, sy + 96], [0, sy + 110], [-12, sy + 96]]); fs(ctx, K.kravat, 3);
    poly(ctx, [[-11, sy + 2], [11, sy + 2], [8, sy + 16], [-8, sy + 16]]); fs(ctx, '#6a2f2f', 3);
    ctx.strokeStyle = OL; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-40, sy); ctx.lineTo(-2, sy + 112); ctx.lineTo(-2, 70); ctx.moveTo(40, sy); ctx.lineTo(2, sy + 112); ctx.stroke();
    rr(ctx, -86, sy + 118, 42, 36, 4); fs(ctx, null, 3); ctx.fillStyle = '#2f5d8a'; ctx.fillRect(-74, sy + 104, 5, 22);
    rr(ctx, 44, sy + 84, 52, 22, 4); fs(ctx, '#fff', 3); ctx.fillStyle = '#7a8a96'; ctx.fillRect(50, sy + 91, 40, 3); ctx.fillRect(50, sy + 98, 28, 3);
  }
}
function kol(ctx, K, side, poz, sy, sw, hy) {
  const ch = !!K.cocuk, w = ch ? 27 : 32;
  const omuz = [side * (sw - 8), sy + 28];
  let dirsek, el;
  switch (poz) {
    case 'masa': dirsek = [side * (sw + 12), sy + 128]; el = [side * (sw - 46), sy + 178]; break;
    case 'kulak': dirsek = [side * (sw + 34), sy + 60]; el = [side * 74, hy + 8]; break;
    case 'agiz': dirsek = [side * (sw + 6), sy + 96]; el = [side * 6, hy + 58]; break;
    case 'direksiyon': dirsek = [side * (sw + 18), sy + 112]; el = [side * 52, sy + 150]; break;
    case 'telefon': dirsek = [side * (sw + 14), sy + 122]; el = [side * 34, sy + 96]; break;
    case 'omuz': dirsek = [side * (sw + 30), sy + 90]; el = [side * (sw + 120), sy + 40]; break;
    default: dirsek = [side * (sw + 14), sy + 118]; el = [side * (sw + 5), sy + 208];
  }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const yol = (pts) => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); };
  ctx.strokeStyle = OL; ctx.lineWidth = w + 10; yol([omuz, dirsek, el]); ctx.stroke();
  ctx.strokeStyle = K.ust; ctx.lineWidth = w; yol([omuz, dirsek]); ctx.stroke();
  ctx.strokeStyle = K.kolTen ? K.ten : K.ust; ctx.lineWidth = w * .9; yol([dirsek, el]); ctx.stroke();
  if (K.kolTen) { ctx.beginPath(); ctx.arc(dirsek[0], dirsek[1], w * .5, 0, TAU); ctx.fillStyle = K.ust; ctx.fill(); }
  ctx.beginPath(); ctx.arc(el[0], el[1], w * .6, 0, TAU); fs(ctx, K.ten, 4.5);
}
function arkaSac(ctx, K, hy, hs) {
  ctx.save(); ctx.translate(0, hy); ctx.scale(hs, hs);
  if (K.sacTip === 'uzun') {
    ctx.beginPath(); ctx.moveTo(-88, -50); ctx.bezierCurveTo(-112, -150, 112, -150, 88, -50); ctx.bezierCurveTo(100, 40, 102, 160, 120, 250); ctx.quadraticCurveTo(0, 280, -120, 250); ctx.bezierCurveTo(-102, 160, -100, 40, -88, -50); ctx.closePath(); fs(ctx, K.sacKoyu);
  } else if (K.sacTip === 'orgu') {
    ctx.beginPath(); ctx.ellipse(0, -18, 92, 104, 0, 0, TAU); fs(ctx, K.sacKoyu);
    for (const sx of [-1, 1]) {
      for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.ellipse(sx * (86 + i * 4), 34 + i * 38, 17 - i, 23, sx * .15, 0, TAU); fs(ctx, K.sac, 4); }
      ctx.beginPath(); const bx = sx * 104, by = 228; ctx.moveTo(bx, by); ctx.lineTo(bx - 22, by - 14); ctx.lineTo(bx - 22, by + 14); ctx.closePath(); ctx.moveTo(bx, by); ctx.lineTo(bx + 22, by - 14); ctx.lineTo(bx + 22, by + 14); ctx.closePath(); fs(ctx, '#e05a5a', 3.5);
    }
  } else if (K.sacTip === 'kisa') {
    ctx.beginPath(); ctx.ellipse(0, -30, 86, 90, 0, Math.PI, TAU); fs(ctx, K.sac);
  }
  ctx.restore();
}
function bas(ctx, id, K, st, hy, hs) {
  const d = st.duygu || 'notr', a = st.agiz || 0, t = st.t || 0;
  ctx.save(); ctx.translate(0, hy); ctx.scale(hs, hs);
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * 79, 6, 14, 21, 0, 0, TAU); fs(ctx, K.ten); ctx.beginPath(); ctx.arc(sx * 80, 7, 8, sx > 0 ? -1.2 : Math.PI - 1.9, sx > 0 ? 1.9 : Math.PI + 1.2); ctx.lineWidth = 3; ctx.stroke(); }
  if (st.pamuk) { ctx.beginPath(); ctx.arc(-82, 10, 9, 0, TAU); fs(ctx, '#ffffff', 3); }
  basYolu(ctx); fs(ctx, K.ten);
  ctx.save(); basYolu(ctx); ctx.clip();
  ctx.fillStyle = K.golge; ctx.globalAlpha = .55; ctx.beginPath(); ctx.ellipse(78, 20, 34, 110, 0, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
  if (K.sakal) { ctx.fillStyle = 'rgba(60,66,82,.2)'; ctx.beginPath(); ctx.ellipse(0, 78, 82, 46, 0, 0, TAU); ctx.fill(); }
  ctx.restore();
  basYolu(ctx); fs(ctx, null);
  if (id === 'KEMAL') { ctx.strokeStyle = 'rgba(150,100,80,.5)'; ctx.lineWidth = 2.5; for (let i = 0; i < 2; i++) { ctx.beginPath(); ctx.moveTo(-30, -66 + i * 9); ctx.quadraticCurveTo(0, -71 + i * 9, 30, -66 + i * 9); ctx.stroke(); } }
  const al = K.allik + (d === 'aglama' ? .25 : 0);
  ctx.fillStyle = `rgba(238,118,112,${al})`; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * 50, 32, 19, 10, 0, 0, TAU); ctx.fill(); }
  const ey = K.cocuk ? 2 : -2;
  for (const sx of [-1, 1]) goz(ctx, sx * 33, ey, K, st, sx, d);
  for (const sx of [-1, 1]) kas(ctx, sx * 33, ey - 38, sx, d, K);

/* ==========================================================================

const btn = document.getElementById('oynat'), bar = document.getElementById('ilerleme'), zEl = document.getElementById('zaman');
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

const q = new URLSearchParams(location.search);

if (q.has('t')) { basOfs = +q.get('t'); document.getElementById('baslat').style.display = 'none'; }
