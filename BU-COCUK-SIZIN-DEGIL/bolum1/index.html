<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700;900&family=Playfair+Display:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#111214; --panel:#1c1d21; --text:#eef0f2; --soft:#9aa0a8; --accent:#e8714f; }
  * { box-sizing:border-box; }

  canvas { width:100%; height:100%; display:block; }
  #baslat { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:16px; background:rgba(8,8,10,.72); cursor:pointer; }
  #baslat b { font-family:"Playfair Display",serif; font-size:clamp(22px,5vh,44px); }
  #baslat span { color:var(--soft); font-size:clamp(13px,2vh,17px); }
  #kontrol { width:min(100vw, 560px); margin:0 auto; padding:10px 16px; display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; background:var(--panel); font-size:14px; }

<div id="sahne">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="baslat"><b>Bu Çocuk Sizin Değil</b><span>Bölüm 1 · Başlatmak için dokun</span></div>
</div>
<div id="kontrol">
  <button id="oynat">▶ Oynat</button>
  <input id="ilerleme" type="range" min="0" max="150" step="0.01" value="0">
  <span id="zaman">0:00</span>
  <label><input id="altyaziKutu" type="checkbox" checked> Altyazı</label>
  <button id="kaydet">🎬 Video Kaydet</button>
  <div id="durum">Sesler yükleniyor…</div>
</div>
<script src="bolum1.js"></script>
<script src="ses_paketi.js" onerror="window.SES_PAKETI=null"></script>
<script>
/* ==========================================================================
   AYARLAR (görsel)
   ========================================================================== */
const GORSEL = {
  altyaziY: 1215,        // altyazı bloğunun dikey merkezi (ekranın ortasına yakın; karakter başları bunun üstünde)
  altyaziPunto: 56,
  sonKartSure: 4.5,
  baslikSure: 3.6,
};

/* ==========================================================================
   YARDIMCILAR
   ========================================================================== */
const W = 1080, H = 1920, TAU = Math.PI * 2;
const cv = document.getElementById('c'), c = cv.getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k, seg = (t, a, b) => clamp((t - a) / (b - a));
const ss = k => k * k * (3 - 2 * k), eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hx = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
function ton(h, f) { const [r, g, b] = hx(h); const m = f < 1 ? [r * f, g * f, b * f] : [r + (255 - r) * (f - 1), g + (255 - g) * (f - 1), b + (255 - b) * (f - 1)]; return '#' + m.map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join(''); }
const rgba = (h, a) => { const [r, g, b] = hx(h); return `rgba(${r},${g},${b},${a})`; };
function boya(ctx, renk, lw = 3.5, kenar) { ctx.fillStyle = renk; ctx.fill(); if (lw) { ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = kenar || (typeof renk === 'string' && renk[0] === '#' ? ton(renk, .5) : '#3a2a24'); ctx.stroke(); } }
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function el(ctx, x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, TAU); }
function poly(ctx, p) { ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]); ctx.closePath(); }
function yazi(ctx, s, x, y, font, renk, hiza = 'center') { ctx.font = font; ctx.fillStyle = renk; ctx.textAlign = hiza; ctx.fillText(s, x, y); }
function isik(ctx, x, y, r, renk, a, mod = 'lighter') { if (a <= 0) return; ctx.save(); ctx.globalCompositeOperation = mod; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(renk, a)); g.addColorStop(1, rgba(renk, 0)); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore(); }
function katman(w, h, fn) { const k = document.createElement('canvas'); k.width = w; k.height = h; fn(k.getContext('2d')); return k; }
function bulanik(src, px) { return katman(src.width, src.height, g => { g.filter = `blur(${px}px)`; g.drawImage(src, 0, 0); }); }
function kam(ctx, cx, cy, z) { ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-cx, -cy); }

/* ==========================================================================
   ZAMANLAMA — sahne seslerinin gerçek zamanlamasından
   ========================================================================== */
const PAKET = window.SES_PAKETI || { sahneler: {}, efektler: {}, muzik: {} };
const SAHNELER = BOLUM.sahneler, L = [];
SAHNELER.forEach((s, si) => s.replikler.forEach((r, ri) => { r.sahne = s; r.si = si; r.ri = ri; L.push(r); }));
let TOPLAM = 150, SONKART = 145, PLANLAR = [], OLAY = {};
function zamanla() {
  for (const s of SAHNELER) {
    const P = PAKET.sahneler[s.id];
    s.replikler.forEach((r, i) => {
      const g = P && P.segmentler.find(x => x.id === r.id);
      if (g) { const sonraki = P.segmentler[i + 1]; r.segBas = g.bas; r.konus = g.bit - g.bas; r.parca = (sonraki ? sonraki.bas : Math.min(P.sure, g.bit + .4)) - g.bas; }
      else { r.segBas = null; r.konus = Math.max(1.4, r.metin.length * .066); r.parca = r.konus + .2; }
    });
  }
  const taban = L.map(r => r.ri === 0 ? (r.si === 0 ? 0 : (r.sahne.oncePlan ? GORSEL.baslikSure + .8 : 1.1)) : .12);
  const agr = L.map(r => r.ri === 0 ? (r.si === 0 ? 0 : 2.5) : (r.vurgu ?? 1));
  const dogal = L.reduce((a, r) => a + r.parca, 0) + taban.reduce((a, b) => a + b, 0) + GORSEL.sonKartSure + .4;
  const fazla = Math.max(0, BOLUM.hedefSure - dogal);
  const birim = fazla / Math.max(1e-6, agr.reduce((a, b) => a + b, 0));
  const ek = agr.map((w, i) => L[i].ri === 0 ? 0 : Math.min(1.1, w * birim));
  const kalan = fazla - ek.reduce((a, b) => a + b, 0), gW = agr.reduce((a, w, i) => a + (L[i].ri === 0 ? w : 0), 0);
  L.forEach((r, i) => { if (r.ri === 0 && gW) ek[i] = kalan * agr[i] / gW; });
  let t = 0;
  L.forEach((r, i) => { r.bosluk = taban[i] + ek[i]; r.gapBas = t; t += r.bosluk; r.bas = t; r.bit = t + r.konus; t += r.parca; });
  SAHNELER.forEach(s => { s.bas = s.replikler[0].gapBas; const son = s.replikler.at(-1); s.bit = son.bas + son.parca; });
  SONKART = t + .4; TOPLAM = SONKART + GORSEL.sonKartSure;
  PLANLAR = [];
  L.forEach(r => {
    if (r.ri === 0) { if (r.sahne.oncePlan) { PLANLAR.push({ t: r.gapBas, plan: r.sahne.oncePlan, s: r.sahne }); PLANLAR.push({ t: r.gapBas + GORSEL.baslikSure, plan: r.plan, s: r.sahne }); } else PLANLAR.push({ t: r.gapBas, plan: r.plan, s: r.sahne }); }
    else PLANLAR.push({ t: r.bas - Math.min(.3, r.bosluk * .6), plan: r.plan, s: r.sahne });
    for (const e of r.ek || []) PLANLAR.push({ t: r.bas + r.konus * e.f, plan: e.plan, s: r.sahne });
  });
  PLANLAR.push({ t: SONKART, plan: 'sonKart', s: null }); PLANLAR.sort((a, b) => a.t - b.t);
  OLAY = { duygu: {}, poz: {} };
  for (const k of Object.keys(BOLUM.karakterler)) { OLAY.duygu[k] = []; OLAY.poz[k] = []; }
  L.forEach(r => { const te = r.ri === 0 ? r.gapBas : r.bas - .25;
    for (const [k, v] of Object.entries(r.duygu || {})) OLAY.duygu[k].push([te, v]);
    for (const [k, v] of Object.entries(r.poz || {})) OLAY.poz[k].push([te, v]); });
  document.getElementById('ilerleme').max = TOPLAM;
}
zamanla();
function cizgi(liste, t, vars, sure = .4) { let o = vars, cr = vars, tc = -99; for (const [tt, v] of liste) { if (tt <= t) { o = cr; cr = v; tc = tt; } else break; } return [o, cr, ss(clamp((t - tc) / sure))]; }
function aktifReplik(t) { for (const r of L) if (t >= r.bas && t < r.bit) return r; return null; }
function sonReplik(t) { let s = L[0]; for (const r of L) { if ((r.ri === 0 ? r.gapBas : r.bas - .25) <= t) s = r; else break; } return s; }
function anlikPlan(t) { let p = PLANLAR[0], o = null; for (const x of PLANLAR) { if (x.t <= t) { o = p; p = x; } else break; } return { p, o }; }

/* ---------- Ses çözümleme + dudak senkronu (genlik + sıfır geçiş → ağız şekli) ---------- */
const TAMPON = { sahne: {}, efekt: {}, muzik: {} }, ZARF = {};
const HAZIR = (async () => {
  if (!window.SES_PAKETI) return;
  const dc = new OfflineAudioContext(2, 1, 44100);
  const coz = async b64 => { const u = Uint8Array.from(atob(b64), ch => ch.charCodeAt(0)); return dc.decodeAudioData(u.buffer); };
  for (const [id, v] of Object.entries(PAKET.sahneler)) {
    const b = await coz(v.veri); TAMPON.sahne[id] = b;
    const d = b.getChannelData(0), sr = b.sampleRate, adim = Math.floor(sr / 60), n = Math.ceil(d.length / adim);
    const rms = new Float32Array(n), zcr = new Float32Array(n);
    for (let i = 0; i < n; i++) { let s = 0, z = 0; const a = i * adim, e = Math.min(d.length, a + adim); for (let j = a; j < e; j++) { s += d[j] * d[j]; if (j > a && (d[j] > 0) !== (d[j - 1] > 0)) z++; } rms[i] = Math.sqrt(s / Math.max(1, e - a)); zcr[i] = z / Math.max(1, e - a); }
    const p = Array.from(rms).sort((x, y) => x - y)[Math.floor(n * .95)] || 1;
    const ac = new Float32Array(n); let v2 = 0;
    for (let i = 0; i < n; i++) { const h = clamp((rms[i] / p - .08) / .75); v2 = h > v2 ? lerp(v2, h, .65) : lerp(v2, h, .3); ac[i] = v2; }
    ZARF[id] = { ac, zcr };
  }
  for (const [ad, v] of Object.entries(PAKET.efektler || {})) TAMPON.efekt[ad] = await coz(v.veri);
  for (const [ad, v] of Object.entries(PAKET.muzik || {})) TAMPON.muzik[ad] = await coz(v.veri);
})();
function agizHali(id, t) {
  const r = aktifReplik(t); if (!r || r.kim !== id) return { ac: 0, gen: 0, yuv: 0, a: 0 };
  const lt = t - r.bas, Z = ZARF[r.sahne.id];
  if (!Z || r.segBas == null) { const v = clamp(.5 + .5 * Math.sin(lt * 15) * Math.sin(lt * 4.7)); return { ac: v * .8, gen: .3, yuv: .2, a: v }; }
  const i = Math.min(Z.ac.length - 1, Math.max(0, Math.floor((r.segBas + lt) * 60)));
  const ac = Z.ac[i], z = Z.zcr[i];
  return { ac: ac * .95, gen: clamp((z - .06) / .12) * ac, yuv: clamp((.05 - z) / .035) * ac * .8, a: ac };
}
const kirp = (id, t) => { const p = 3.3 + (id.charCodeAt(1) % 5) * .5, l = (t * 1.0 + id.charCodeAt(0) * .41) % p; return l < .15 ? Math.sin(l / .15 * Math.PI) : 0; };

/* ==========================================================================
   KARAKTERLER
   ========================================================================== */
const KAR = {
  ASLI:  { ten: '#f1c6a6', sac: '#3e241a', sacAcik: '#7a4a33', sacTip: 'dalgali', iris: '#7b5230', dudak: '#c4706b', kadin: true, ust: '#e9dcc6', ust2: '#d2c3aa', ic: '#fbf8f3', alt: '#4a5570', kupe: true },
  KEREM: { ten: '#d9a681', sac: '#211916', sacAcik: '#4a3a33', sacTip: 'kisa', iris: '#4b3221', ust: '#5e6873', ust2: '#4b545e', ic: '#e4ebf2', alt: '#363b43', sakal: true, kolTen: false, saat: true },
  NIHAL: { ten: '#e7ba98', sac: '#2c2523', sacAcik: '#8f8a85', sacTip: 'topuz', iris: '#5b4231', dudak: '#b36c66', kadin: true, ust: '#f6f8f9', ust2: '#dde3e7', ic: '#3e8c87', alt: '#4b4f57', gozluk: true, steteskop: true },
  DURU:  { ten: '#f7d5ba', sac: '#8d5d3b', sacAcik: '#c08a5e', sacTip: 'atkuyrugu', iris: '#5f84a3', dudak: '#e28d88', kadin: true, cocuk: true, ust: '#f2897c', ust2: '#d9705f', ic: '#ffffff', alt: '#6b8db6', toka: '#ffd447' },
};
const OL = { yetiskin: { hy: -340, sy: -228, sw: 112, ww: 98, nw: 22, kw: 33, bacak: 330 }, cocuk: { hy: -262, sy: -168, sw: 80, ww: 74, nw: 17, kw: 26, bacak: 250 } };
const DUYGU = {
  notr:       { ki: 0, kd: 0, ust: .04, alt: 0, gul: 0 },
  gulumse:    { ki: -2, kd: -1, ust: .06, alt: .4, gul: .85 },
  merakli:    { ki: -6, kd: -5, ust: 0, alt: 0, gul: .12 },
  endise:     { ki: -10, kd: 2, ust: .1, alt: .05, gul: -.35 },
  uzgun:      { ki: -12, kd: 5, ust: .3, alt: .1, gul: -.6 },
  aglama:     { ki: -14, kd: 6, ust: .34, alt: .22, gul: -.75, yas: 1 },
  sok:        { ki: -16, kd: -13, ust: -.18, alt: 0, gul: -.25, ac: .35 },
  ciddi:      { ki: 5, kd: -1, ust: .22, alt: .1, gul: -.1 },
  supheli:    { ki: 6, kd: -2, asim: 13, ust: .32, alt: .22, gul: -.05 },
  sakin:      { ki: 1, kd: 1, ust: .36, alt: .12, gul: .2 },
  sefkat:     { ki: -7, kd: 2, ust: .16, alt: .28, gul: .38 },
  aci:        { ki: 9, kd: -3, ust: .46, alt: .36, gul: -.5, asimGoz: .35 },
  uyku:       { ki: 2, kd: 2, ust: 1, alt: 0, gul: .05 },
  zorGulumse: { ki: -10, kd: 3, ust: .24, alt: .28, gul: .42, yas: .45 },
  umut:       { ki: -8, kd: -3, ust: 0, alt: .12, gul: .28 },
};
function karistir(a, b, k) { const o = {}; for (const key of new Set([...Object.keys(a), ...Object.keys(b)])) o[key] = lerp(a[key] || 0, b[key] || 0, k); return o; }
const POZ = {
  yan:   P => ({ sol: { d: [-P.sw - 8, P.sy + 118], e: [-P.sw + 2, P.sy + 220] }, sag: { d: [P.sw + 8, P.sy + 118], e: [P.sw - 2, P.sy + 220] } }),
  masa:  P => ({ sol: { d: [-P.sw - 14, P.sy + 128], e: [-P.sw + 64, P.sy + 186] }, sag: { d: [P.sw + 14, P.sy + 128], e: [P.sw - 64, P.sy + 186] } }),
  kagit: P => ({ sol: POZ.masa(P).sol, sag: { d: [P.sw + 22, P.sy + 118], e: [36, P.sy + 96] }, kagit: 1 }),
  gogus: P => ({ sol: { d: [-P.sw - 12, P.sy + 112], e: [-18, P.sy + 72] }, sag: POZ.yan(P).sag }),
  agiz:  P => ({ sol: { d: [-P.sw - 6, P.sy + 94], e: [-6, P.hy + 62] }, sag: POZ.yan(P).sag, onde: 1 }),
  kulak: P => ({ sol: POZ.yan(P).sol, sag: { d: [P.sw + 36, P.sy + 56], e: [P.sw * .66 + 22, P.hy + 10] }, onde: 1 }),
  kollar:P => ({ sag: { d: [P.sw + 16, P.sy + 126], e: [-44, P.sy + 104] }, sol: { d: [-P.sw - 16, P.sy + 134], e: [48, P.sy + 118] } }),
  gozluk:P => ({ sol: POZ.masa(P).sol, sag: { d: [P.sw + 26, P.sy + 66], e: [14, P.hy - 12] }, onde: 1 }),
  direksiyon: P => ({ sol: { d: [-P.sw - 16, P.sy + 112], e: [-72, P.sy + 150] }, sag: { d: [P.sw + 16, P.sy + 112], e: [72, P.sy + 150] } }),
  telefon: P => ({ sol: POZ.direksiyon(P).sol, sag: { d: [P.sw + 14, P.sy + 124], e: [38, P.sy + 96] }, telefon: 1 }),
  alin:  P => ({ sol: POZ.yan(P).sol, sag: { d: [P.sw + 74, P.sy + 46], e: [P.sw + 178, P.sy - 36] } }),
  saril: P => ({ sol: { d: [-P.sw - 26, P.sy + 74], e: [-P.sw - 34, P.sy + 30] }, sag: { d: [P.sw + 64, P.sy + 66], e: [P.sw + 176, P.sy + 34] }, onde: 1 }),
};
function pozKaristir(a, b, k) { const m = (p, q) => [lerp(p[0], q[0], k), lerp(p[1], q[1], k)]; const o = { sol: { d: m(a.sol.d, b.sol.d), e: m(a.sol.e, b.sol.e) }, sag: { d: m(a.sag.d, b.sag.d), e: m(a.sag.e, b.sag.e) } }; for (const f of ['kagit', 'telefon', 'onde']) o[f] = lerp(a[f] || 0, b[f] || 0, k); return o; }

// Ana çizim: x,y = bel ortası; s = ölçek
function kar(ctx, id, x, y, s, st) {
  const K = Object.assign({}, KAR[id], st.kiyafet || {}), P = K.cocuk ? OL.cocuk : OL.yetiskin, t = st.t;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const nefes = Math.sin(t * 1.55 + id.length) * .5 + .5;
  if (st.bacak) bacaklar(ctx, K, P, st.bacak);
  ctx.translate(0, -nefes * 2);
  const pz = st.poz;
  const bt = (fn) => { ctx.save(); ctx.translate(0, P.sy - 10); ctx.rotate(st.egim); ctx.translate(0, -(P.sy - 10) + st.bas); fn(); ctx.restore(); };
  bt(() => arkaSac(ctx, K, P, st));
  ctx.fillStyle = K.ten; ctx.fillRect(-P.nw, P.hy + 70, P.nw * 2, P.sy - P.hy - 62);
  ctx.fillStyle = ton(K.ten, .86); ctx.fillRect(-P.nw, P.hy + 76, P.nw * 2, 26);
  ctx.strokeStyle = ton(K.ten, .55); ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(-P.nw, P.hy + 82); ctx.lineTo(-P.nw, P.sy + 4); ctx.moveTo(P.nw, P.hy + 82); ctx.lineTo(P.nw, P.sy + 4); ctx.stroke();
  const omuzY = P.sy + 26 - nefes * 1.5;
  govde(ctx, id, K, P, st);
  const gestur = st.agiz.a * 6;
  const sol = { d: pz.sol.d, e: [pz.sol.e[0], pz.sol.e[1] - gestur * .6] }, sag = { d: pz.sag.d, e: [pz.sag.e[0] + gestur * .3, pz.sag.e[1] - gestur] };
  if (!(pz.onde > .5)) { kol(ctx, K, P, [-P.sw + 10, omuzY], sol.d, sol.e, -1); kol(ctx, K, P, [P.sw - 10, omuzY], sag.d, sag.e, 1, pz); }
  bt(() => basCiz(ctx, id, K, P, st));
  if (pz.onde > .5) { kol(ctx, K, P, [-P.sw + 10, omuzY], sol.d, sol.e, -1); kol(ctx, K, P, [P.sw - 10, omuzY], sag.d, sag.e, 1, pz); }
  ctx.restore();
}
function bacaklar(ctx, K, P, mod) {
  const ww = P.ww, L2 = P.bacak;
  if (mod === 'ayakta') {
    for (const sx of [-1, 1]) { poly(ctx, [[sx * 6, 0], [sx * (ww - 6), 0], [sx * (ww - 16), L2 - 10], [sx * 12, L2 - 10]]); boya(ctx, K.alt); el(ctx, sx * (ww / 2 + 2), L2, 42, 15); boya(ctx, '#3b302b'); }
  } else {
