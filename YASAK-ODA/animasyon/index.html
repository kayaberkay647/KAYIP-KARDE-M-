<style>

  canvas { width:100%; height:100%; display:block; }
  #baslat { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
            background:rgba(0,0,0,.72); cursor:pointer; font-family:"Special Elite",monospace; letter-spacing:.08em; }

  #kontrol { width:min(100vw, calc(82vh * 16 / 9)); margin:0 auto; padding:12px 16px; display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center;
             background:var(--panel); font-size:14px; }
  #kontrol button, #kontrol label.btn { background:#1a2130; color:var(--text); border:1px solid #2a3446; border-radius:6px; padding:7px 12px; cursor:pointer; font:inherit; }

  #ilerleme { flex:1 1 240px; accent-color:var(--accent); }
  #durum { width:100%; color:var(--soft); font-size:12.5px; }

/* ==========================================================================
   YARDIMCILAR
   ========================================================================== */
const W = 1920, H = 1080, TAU = Math.PI * 2;
const cv = document.getElementById('c'), c = cv.getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = k => k * k * (3 - 2 * k);
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const rgba = (c3, a) => `rgba(${c3[0]},${c3[1]},${c3[2]},${a})`;
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const titre = t => 0.88 + 0.06 * Math.sin(t * 13.1) + 0.04 * Math.sin(t * 31.7 + 1) + 0.03 * Math.sin(t * 7.3 + 2);
function poly(ctx, pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); ctx.fill(); }
function kamera(ctx, cx, cy, z, sx = 0, sy = 0) { ctx.translate(W / 2 + sx, H / 2 + sy); ctx.scale(z, z); ctx.translate(-cx, -cy); }
// Kamera yolu: [[zaman, merkezX, merkezY, zoom], ...]
function kamYol(t, keys) {
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 0; i < keys.length - 1; i++) { const a = keys[i], b = keys[i + 1]; if (t <= b[0]) { const k = eio(seg(t, a[0], b[0])); return [lerp(a[1], b[1], k), lerp(a[2], b[2], k), lerp(a[3], b[3], k)]; } }
  return keys[keys.length - 1].slice(1);
}
function isik(ctx, x, y, r, renk, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(renk, a)); g.addColorStop(.35, rgba(renk, a * .45)); g.addColorStop(1, rgba(renk, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
}
function siyah(ctx, a) { if (a <= 0) return; ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(0,0,0,${clamp(a)})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }

// Karanlık maskesi: ekranı karartır, ışık noktalarında delik açar (dünya koordinatlarında)
const MK = document.createElement('canvas'); MK.width = W; MK.height = H; const mk = MK.getContext('2d');
function karanlik(ctx, taban, isiklar) {
  mk.setTransform(1, 0, 0, 1, 0, 0); mk.globalCompositeOperation = 'source-over'; mk.clearRect(0, 0, W, H);
  mk.fillStyle = `rgba(0,0,0,${taban})`; mk.fillRect(0, 0, W, H);
  mk.setTransform(ctx.getTransform()); mk.globalCompositeOperation = 'destination-out';
  for (const l of isiklar) {
    if (l.kaynak) { // el feneri konisi
      const dx = l.x - l.kaynak[0], dy = l.y - l.kaynak[1], len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len, w = l.r * .75;
      const lg = mk.createLinearGradient(l.kaynak[0], l.kaynak[1], l.x, l.y); lg.addColorStop(0, `rgba(0,0,0,${l.g * .15})`); lg.addColorStop(1, `rgba(0,0,0,${l.g * .45})`);
      mk.fillStyle = lg; mk.beginPath(); mk.moveTo(l.kaynak[0] + nx * 8, l.kaynak[1] + ny * 8); mk.lineTo(l.x + nx * w, l.y + ny * w); mk.lineTo(l.x - nx * w, l.y - ny * w); mk.lineTo(l.kaynak[0] - nx * 8, l.kaynak[1] - ny * 8); mk.closePath(); mk.fill();
    }
    const g = mk.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r);
    g.addColorStop(0, `rgba(0,0,0,${l.g})`); g.addColorStop(.45, `rgba(0,0,0,${l.g * .65})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    mk.fillStyle = g; mk.fillRect(l.x - l.r, l.y - l.r, l.r * 2, l.r * 2);
  }
  mk.setTransform(1, 0, 0, 1, 0, 0); mk.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(MK, 0, 0); ctx.restore();
}

/* ---------- Karakter siluetleri ---------- */
// x,y = ayak ortası, h = boy (px). Arkadan / önden siluet.
function kisi(ctx, x, y, h, o = {}) {
  const s = h / 100; ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const ten = o.renk || '#06080b', govde = o.govde || ten, bacak = o.bacak || govde;
  const e = o.yasli ? 5 : 0;
  ctx.fillStyle = bacak;
  ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-9, -44); ctx.lineTo(9, -44); ctx.lineTo(10, 0); ctx.lineTo(2.5, 0); ctx.lineTo(0, -33); ctx.lineTo(-2.5, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = govde;
  ctx.beginPath(); ctx.moveTo(-12.5, o.mont ? -30 : -40); ctx.bezierCurveTo(-16, -55, -15, -70, -11 + e, -80); ctx.quadraticCurveTo(e, -84, 11 + e, -80); ctx.bezierCurveTo(15, -70, 16, -55, 12.5, o.mont ? -30 : -40); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = govde; ctx.lineCap = 'round'; ctx.lineWidth = 6;
  const sol = o.solEl || [-15, -46], sag = o.sagEl || [15, -46];
  ctx.beginPath(); ctx.moveTo(-10 + e, -76); ctx.quadraticCurveTo(-17, -63, sol[0], sol[1]); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10 + e, -76); ctx.quadraticCurveTo(o.sagEl ? (10 + sag[0]) / 2 + 4 : 17, o.sagEl ? (-76 + sag[1]) / 2 - 4 : -63, sag[0], sag[1]); ctx.stroke();
  if (o.canta) { ctx.fillStyle = o.cantaRenk || '#0b0e13'; ctx.beginPath(); ctx.roundRect(-10, -77, 20, 27, 4); ctx.fill(); }
  const hy = o.yasli ? -86 : -89, hr = o.cocuk ? 1.15 : 1;
  ctx.fillStyle = ten; ctx.fillRect(-3 + e, -84, 6, 6);
  ctx.beginPath(); ctx.ellipse(e, hy, 8 * hr, 9.5 * hr, 0, 0, TAU); ctx.fill();
  if (o.sac === 'uzun') {
    ctx.fillStyle = o.sacRenk || ten;
    ctx.beginPath(); ctx.moveTo(-8.5 * hr + e, hy - 2); ctx.bezierCurveTo(-12 + e, hy + 14, -11, hy + 24, -9, -60); ctx.lineTo(9, -60); ctx.bezierCurveTo(11, hy + 24, 12 + e, hy + 14, 8.5 * hr + e, hy - 2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(e, hy - 1, 8.7 * hr, 9.9 * hr, 0, 0, TAU); ctx.fill();
  }
  if (o.kasket) { ctx.fillStyle = ten; ctx.beginPath(); ctx.ellipse(e, hy - 4, 9.8, 6, 0, Math.PI, 0); ctx.fill(); ctx.fillRect(e - 13, hy - 5, 9, 2.4); }
  ctx.restore();
}
function fener(ctx, x, y, s, p) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = '#120d09'; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(0, -22, 6, Math.PI, 0); ctx.stroke();
  ctx.fillStyle = '#1e1610'; ctx.fillRect(-9, -17, 18, 4); ctx.fillRect(-10, 12, 20, 4);
  ctx.fillStyle = rgba([255, 196, 120], .92 * p); ctx.beginPath(); ctx.ellipse(0, -1, 7.5, 12, 0, 0, TAU); ctx.fill();
  ctx.restore();
  isik(ctx, x, y, s * 330, [232, 150, 58], .42 * p); isik(ctx, x, y, s * 45, [255, 224, 170], .75 * p);
}

/* ---------- Önceden çizilen katmanlar ---------- */
function katman(fn) { const k = document.createElement('canvas'); k.width = W; k.height = H; fn(k.getContext('2d')); return k; }
function agac(ctx, x, y, len, ang, d, r, w) {
  if (d === 0 || len < 3) return;
  const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
  ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x2, y2); ctx.stroke();
  const n = r() < .35 ? 3 : 2;
  for (let i = 0; i < n; i++) agac(ctx, x2, y2, len * (.62 + r() * .2), ang + (r() - .5) * 1.15, d - 1, r, w * .66);
}
const DIS = katman(g => {
  const sky = g.createLinearGradient(0, 0, 0, 650); sky.addColorStop(0, '#0b111b'); sky.addColorStop(.6, '#232c3a'); sky.addColorStop(1, '#4a4955');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  const ay = g.createRadialGradient(1520, 170, 0, 1520, 170, 260); ay.addColorStop(0, 'rgba(190,205,225,.35)'); ay.addColorStop(1, 'rgba(190,205,225,0)'); g.fillStyle = ay; g.fillRect(1200, 0, 700, 450);
  const dag = (seed, base, amp, renk) => { const r = rng(seed); g.fillStyle = renk; g.beginPath(); g.moveTo(0, H); let y = base; for (let x = 0; x <= W + 40; x += 40) { y = clamp(y + (r() - .5) * amp * .5, base - amp, base); g.lineTo(x, y); } g.lineTo(W, H); g.closePath(); g.fill(); };
  dag(3, 520, 210, '#242d3b'); dag(9, 600, 130, '#1a212c');
  const zemin = g.createLinearGradient(0, 640, 0, H); zemin.addColorStop(0, '#5a6370'); zemin.addColorStop(1, '#a9b2be');
  g.fillStyle = zemin; g.fillRect(0, 640, W, H - 640);
  g.fillStyle = 'rgba(60,66,78,.55)'; poly(g, [[770, H], [1240, H], [1125, 655], [1080, 655]]);
  g.fillStyle = 'rgba(60,66,78,.45)'; poly(g, [[700, H], [900, H], [300, 690], [230, 690]]);
  // uzak ağaç sırası
  const r = rng(21); g.strokeStyle = '#11161e';
  for (let i = 0; i < 46; i++) { const x = r() * W; if (x > 950 && x < 1260) continue; agac(g, x, 640 + r() * 8, 18 + r() * 22, -Math.PI / 2, 5, rng(100 + i), 2.2); }
  g.strokeStyle = '#07090d'; g.lineCap = 'round';
  agac(g, 170, 790, 175, -Math.PI / 2 + .05, 8, rng(5), 16); agac(g, 420, 700, 105, -Math.PI / 2 - .08, 7, rng(6), 9);
  agac(g, 1760, 760, 160, -Math.PI / 2 - .04, 8, rng(7), 14); agac(g, 1560, 680, 80, -Math.PI / 2, 6, rng(8), 7);
  // ev
  const x = 1100, y = 650;
  g.fillStyle = '#10151d'; g.fillRect(x - 190, y - 120, 380, 120); g.fillRect(x - 205, y - 232, 410, 112);
  g.fillStyle = '#0a0d13'; poly(g, [[x - 250, y - 230], [x, y - 360], [x + 250, y - 230]]);
  g.fillStyle = '#0d1118'; g.fillRect(x + 110, y - 360, 34, 80);
  g.strokeStyle = '#cfd6de'; g.lineWidth = 9; g.beginPath(); g.moveTo(x - 246, y - 236); g.lineTo(x, y - 364); g.lineTo(x + 246, y - 236); g.stroke();
  g.strokeStyle = '#1a212c'; g.lineWidth = 3; for (let k = 0; k < 6; k++) { g.beginPath(); g.moveTo(x - 205, y - 222 + k * 20); g.lineTo(x + 205, y - 222 + k * 20); g.stroke(); }
  g.strokeStyle = '#bfc7d1'; g.lineWidth = 5; g.beginPath(); g.moveTo(x - 210, y - 118); g.lineTo(x + 210, y - 118); g.stroke();
  for (const wx of [x - 120, x, x + 120]) { g.fillStyle = '#05070a'; g.fillRect(wx - 23, y - 212, 46, 62); g.strokeStyle = '#141a23'; g.lineWidth = 3; g.strokeRect(wx - 23, y - 212, 46, 62); g.beginPath(); g.moveTo(wx, y - 212); g.lineTo(wx, y - 150); g.stroke(); }
  for (const wx of [x - 120, x + 120]) { g.fillStyle = '#05070a'; g.fillRect(wx - 25, y - 95, 50, 60); }

window.cizim = cizim;

/* ==========================================================================
   SES MOTORU (Web Audio)
   ========================================================================== */
const SES = { A: null, ana: null, kayitHedef: null, yanki: null, aktif: [], tampon: {} };
function sesKur(A) {
  SES.A = A;
  const lim = A.createDynamicsCompressor(); lim.threshold.value = -10; lim.knee.value = 6; lim.ratio.value = 12; lim.attack.value = .003; lim.release.value = .25; lim.connect(A.destination);
  SES.ana = A.createGain(); SES.ana.gain.value = .85; SES.ana.connect(lim); SES.cikis = lim;
  const n = A.sampleRate * 2, nb = A.createBuffer(1, n, A.sampleRate), d = nb.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; SES.gurultu = nb;

function sesBaslat() {

  sesKur(new (window.AudioContext || window.webkitAudioContext)());
  SES.kayitHedef = SES.A.createMediaStreamDestination(); SES.cikis.connect(SES.kayitHedef);
  for (const [k, b] of Object.entries(SES.bekleyen || {})) cozVeKaydet(k, b);
}
// Video dışa aktarma aracı (video_disa_aktar.js) için: tüm sesi çevrimdışı üretir, WAV (base64) döndürür.
window.cevrimdisiSes = async (dosyalar = {}) => {
  const sr = 44100, off = new OfflineAudioContext(2, sr * AYAR.sure, sr); sesKur(off);
  for (const [id, b64] of Object.entries(dosyalar)) { const u = Uint8Array.from(atob(b64), ch => ch.charCodeAt(0)); try { SES.tampon[id] = await off.decodeAudioData(u.buffer); } catch (e) { } }
  hepsiniPlanla(0); const buf = await off.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1), len = L.length, ab = new ArrayBuffer(44 + len * 4), v = new DataView(ab);
  const ws = (o, x) => { for (let i = 0; i < x.length; i++) v.setUint8(o + i, x.charCodeAt(i)); };
  ws(0, 'RIFF'); v.setUint32(4, 36 + len * 4, true); ws(8, 'WAVE'); ws(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, len * 4, true);
  let o = 44; for (let i = 0; i < len; i++) { v.setInt16(o, clamp(L[i], -1, 1) * 32767, true); v.setInt16(o + 2, clamp(R[i], -1, 1) * 32767, true); o += 4; }
  let x = ''; const u = new Uint8Array(ab); for (let i = 0; i < u.length; i += 32768) x += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(x);
};
function izle(n) { SES.aktif.push(n); return n; }
function kazanc(v, hedef) { const g = SES.A.createGain(); g.gain.value = v; if (hedef) g.connect(hedef); return g; }
function gurultu(w) { const s = SES.A.createBufferSource(); s.buffer = SES.gurultu; s.loop = true; izle(s); return s; }
function filtre(tip, f, q = 1) { const b = SES.A.createBiquadFilter(); b.type = tip; b.frequency.value = f; b.Q.value = q; return b; }
function efektCal(e, w, ofs) {
  const A = SES.A, cik = kazanc(AYAR.efektSes * (e.ses ?? 1), SES.ana), yk = kazanc(.0, SES.yanki); cik.connect(yk);
  const kalan = (e.sure || 0) - ofs;
  switch (e.tip) {
    case 'ruzgar': { const s = gurultu(), f = filtre('bandpass', 480, .6), g = kazanc(0, cik); const l = izle(A.createOscillator()), lg = kazanc(260); l.frequency.value = .13; l.connect(lg); lg.connect(f.frequency); s.connect(f); f.connect(g); g.gain.setValueAtTime(0, w); g.gain.linearRampToValueAtTime(.7, w + Math.min(1.5, kalan / 3)); g.gain.setValueAtTime(.7, w + kalan - 1.5); g.gain.linearRampToValueAtTime(0, w + kalan); s.start(w); l.start(w); s.stop(w + kalan + .1); l.stop(w + kalan + .1); break; }
    case 'vurus': { const gc = e.guc ?? 1; yk.gain.value = .5 * gc; const o = izle(A.createOscillator()), g = kazanc(0, cik); o.frequency.setValueAtTime(120, w); o.frequency.exponentialRampToValueAtTime(48, w + .14); o.connect(g); g.gain.setValueAtTime(.95 * gc, w); g.gain.exponentialRampToValueAtTime(.001, w + .3); o.start(w); o.stop(w + .35);
      const s = gurultu(), f = filtre('lowpass', 900), g2 = kazanc(0, cik); s.connect(f); f.connect(g2); g2.gain.setValueAtTime(.7 * gc, w); g2.gain.exponentialRampToValueAtTime(.001, w + .09); s.start(w); s.stop(w + .12); break; }
    case 'gumbur': { yk.gain.value = .6; const o = izle(A.createOscillator()), g = kazanc(0, cik); o.frequency.setValueAtTime(58, w); o.frequency.exponentialRampToValueAtTime(28, w + 2.5); o.connect(g); g.gain.setValueAtTime(0, w); g.gain.linearRampToValueAtTime(.9, w + .05); g.gain.exponentialRampToValueAtTime(.001, w + 3.5); o.start(w); o.stop(w + 3.6);
      const s = gurultu(), f = filtre('lowpass', 220), g2 = kazanc(0, cik); s.connect(f); f.connect(g2); g2.gain.setValueAtTime(.5, w); g2.gain.exponentialRampToValueAtTime(.001, w + 2.5); s.start(w); s.stop(w + 2.6); break; }
    case 'araba': { const o = izle(A.createOscillator()), f = filtre('lowpass', 200), g = kazanc(0, cik); o.type = 'sawtooth'; o.frequency.value = 46; o.connect(f); f.connect(g); g.gain.setValueAtTime(.32 * (1 - ofs / e.sure), w); g.gain.exponentialRampToValueAtTime(.001, w + kalan); o.start(w); o.stop(w + kalan); break; }
    case 'adim': case 'tahta': { const ar = e.aralik || .6; for (let x = Math.ceil(ofs / ar) * ar; x < e.sure; x += ar) { const tt = w + x - ofs, v = e.uzaklas ? 1 - x / e.sure : 1;
        const s = gurultu(), f = filtre('lowpass', e.kar ? 1500 : 380), g = kazanc(0, cik); s.connect(f); f.connect(g); g.gain.setValueAtTime(.55 * v, tt); g.gain.exponentialRampToValueAtTime(.001, tt + (e.kar ? .16 : .1)); s.start(tt); s.stop(tt + .2);
        if (!e.kar) { const o = izle(A.createOscillator()), g2 = kazanc(0, cik); o.frequency.value = 72; o.connect(g2); g2.gain.setValueAtTime(.4 * v, tt); g2.gain.exponentialRampToValueAtTime(.001, tt + .12); o.start(tt); o.stop(tt + .15);
          if (Math.random() < .35) { const o2 = izle(A.createOscillator()), f2 = filtre('bandpass', 700, 9), g3 = kazanc(0, cik); o2.type = 'sawtooth'; o2.frequency.setValueAtTime(190, tt + .05); o2.frequency.linearRampToValueAtTime(140, tt + .4); o2.connect(f2); f2.connect(g3); g3.gain.setValueAtTime(0, tt); g3.gain.linearRampToValueAtTime(.12 * v, tt + .1); g3.gain.linearRampToValueAtTime(0, tt + .42); o2.start(tt); o2.stop(tt + .45); } } } break; }
    case 'kopek': { yk.gain.value = .8; const f = filtre('lowpass', 1300); f.connect(kazanc(.5, cik)); for (const d of [0, .2]) { const o = izle(A.createOscillator()), g = kazanc(0, f); o.type = 'sawtooth'; o.frequency.setValueAtTime(430, w + d); o.frequency.exponentialRampToValueAtTime(260, w + d + .13); o.connect(g); g.gain.setValueAtTime(0, w + d); g.gain.linearRampToValueAtTime(.18, w + d + .02); g.gain.exponentialRampToValueAtTime(.001, w + d + .15); o.start(w + d); o.stop(w + d + .17); } break; }
    case 'gicirti': { yk.gain.value = .5; for (const [fr, q] of [[205, 7], [410, 12]]) { const o = izle(A.createOscillator()), f = filtre('bandpass', fr * 3.5, q), g = kazanc(0, cik); o.type = 'sawtooth'; o.frequency.setValueAtTime(fr, w); o.frequency.linearRampToValueAtTime(fr * .7, w + .7); o.frequency.linearRampToValueAtTime(fr * .82, w + 1.5); o.connect(f); f.connect(g); g.gain.setValueAtTime(0, w); g.gain.linearRampToValueAtTime(.35, w + .15); g.gain.setValueAtTime(.3, w + 1.2); g.gain.linearRampToValueAtTime(0, w + 1.6); o.start(w); o.stop(w + 1.7); } break; }
    case 'fener': { const s = gurultu(), f = filtre('highpass', 2500), g = kazanc(.025, cik); s.connect(f); f.connect(g); s.start(w); s.stop(w + kalan); break; }
    case 'sonme': { const s = gurultu(), f = filtre('bandpass', 900, 1.5), g = kazanc(0, cik); s.connect(f); f.connect(g); g.gain.setValueAtTime(.4, w); g.gain.exponentialRampToValueAtTime(.001, w + .45); s.start(w); s.stop(w + .5); break; }
    case 'tiktak': { for (let x = Math.ceil(ofs); x < e.sure; x++) { const tt = w + x - ofs, s = gurultu(), f = filtre('highpass', 3200), g = kazanc(0, cik); s.connect(f); f.connect(g); g.gain.setValueAtTime(.16, tt); g.gain.exponentialRampToValueAtTime(.001, tt + .03); s.start(tt); s.stop(tt + .05); } break; }
    case 'nefes': { const s = gurultu(), f = filtre('bandpass', 650, 1.2), g = kazanc(0, cik); s.connect(f); f.connect(g); for (let x = 0; x < kalan; x += 3.6) { g.gain.setValueAtTime(0, w + x); g.gain.linearRampToValueAtTime(.16, w + x + 1.4); g.gain.linearRampToValueAtTime(0, w + x + 3.4); } s.start(w); s.stop(w + kalan); break; }
    case 'drone': { const f = filtre('lowpass', 240), g = kazanc(0, cik); f.connect(g); const top = e.sure; const g0 = .05 + .4 * ofs / top;
      for (const fr of [55, 55.7, 27.5]) { const o = izle(A.createOscillator()); o.type = fr < 30 ? 'sine' : 'sawtooth'; o.frequency.value = fr; o.connect(f); o.start(w); o.stop(w + kalan); }
      const hi = izle(A.createOscillator()), hg = kazanc(.012, cik); hi.frequency.value = 1244; hi.connect(hg); hi.start(w); hi.stop(w + kalan);
      g.gain.setValueAtTime(g0, w); g.gain.linearRampToValueAtTime(.45, w + kalan - .03); g.gain.linearRampToValueAtTime(0, w + kalan); break; }
    case 'carp': { yk.gain.value = 1; const s = gurultu(), f = filtre('lowpass', 1100), g = kazanc(0, cik); s.connect(f); f.connect(g); g.gain.setValueAtTime(1.2, w); g.gain.exponentialRampToValueAtTime(.001, w + .7); s.start(w); s.stop(w + .8);
      const o = izle(A.createOscillator()), g2 = kazanc(0, cik); o.frequency.setValueAtTime(70, w); o.frequency.exponentialRampToValueAtTime(30, w + .9); o.connect(g2); g2.gain.setValueAtTime(1, w); g2.gain.exponentialRampToValueAtTime(.001, w + 1.1); o.start(w); o.stop(w + 1.2); break; }
  }
}
function replikCal(r, w, ofs) {
  const b = SES.tampon[r.id]; if (!b) return;
  const A = SES.A, O = r.efekt === 'O', hiz = O ? .92 : 1;
  if (ofs >= b.duration / hiz) return;
  const pan = A.createStereoPanner(); pan.pan.value = r.pan || 0; pan.connect(SES.ana);
  const g = kazanc(AYAR.diyalogSes * (r.ses ?? 1), pan);
  const s = izle(A.createBufferSource()); s.buffer = b; s.playbackRate.value = hiz; s.connect(g); s.start(w, ofs * hiz);
  if (O) { const yk = kazanc(.7, SES.yanki); g.connect(yk);
    const s2 = izle(A.createBufferSource()); s2.buffer = b; s2.playbackRate.value = hiz * .985; const g2 = kazanc(.3, pan); const lp = filtre('lowpass', 1800); s2.connect(lp); lp.connect(g2); s2.start(w + .1, ofs * hiz); }
}
function hepsiniPlanla(ofs) {
  const now = SES.A.currentTime + .05;
  for (const e of AYAR.efektler) { const son = e.t + (e.sure || 4); if (son <= ofs) continue; efektCal(e, now + Math.max(0, e.t - ofs), Math.max(0, ofs - e.t)); }
  for (const r of AYAR.replikler) { if (r.t + 30 <= ofs) continue; replikCal(r, now + Math.max(0, r.t - ofs), Math.max(0, ofs - r.t)); }
  return now;
}
function hepsiniDurdur() { for (const n of SES.aktif) { try { n.stop(); } catch (e) { } } SES.aktif = []; }

/* ---------- Ses dosyaları ---------- */
SES.bekleyen = {};
function cozVeKaydet(id, arr) {
  if (!SES.A) { SES.bekleyen[id] = arr; return Promise.resolve(); }
  return SES.A.decodeAudioData(arr.slice(0)).then(b => { SES.tampon[id] = b; delete SES.bekleyen[id]; durumGuncelle(); }).catch(() => { });
}
function durumGuncelle() {
  const n = Object.keys(SES.tampon).length + Object.keys(SES.bekleyen).length;
  const el = document.getElementById('durum');
  if (n) el.innerHTML = `<b>${n} / ${AYAR.replikler.length}</b> diyalog sesi yüklendi. Eksik olanlar altyazı olarak görünür.`;
}
async function klasordenYukle() {
  if (location.protocol === "file:") return;
  await Promise.all(AYAR.replikler.map(async r => { try { const res = await fetch(`${AYAR.sesKlasoru}/${r.dosya}`); if (res.ok) { SES.bekleyen[r.id] = await res.arrayBuffer(); } } catch (e) { } }));
  durumGuncelle();
}
document.getElementById('sesDosya').addEventListener('change', async ev => {
  for (const f of ev.target.files) { const m = f.name.toUpperCase().match(/R(\d{2})/); if (!m) continue; const id = 'R' + m[1]; if (!AYAR.replikler.find(r => r.id === id)) continue; const arr = await f.arrayBuffer(); sesBaslat(); await cozVeKaydet(id, arr); }
  durumGuncelle(); if (oynuyor) { const t = simdi(); dur(); oynat(t); }
});

/* ==========================================================================
   OYNATICI
   ========================================================================== */
let oynuyor = false, basOfs = 0, basZaman = 0, kayitci = null;
const btn = document.getElementById('oynat'), bar = document.getElementById('ilerleme'), zEl = document.getElementById('zaman');
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function simdi() { return oynuyor ? basOfs + (SES.A.currentTime - basZaman) : basOfs; }
function oynat(ofs = basOfs) {
  sesBaslat(); SES.A.resume(); if (ofs >= AYAR.sure - .05) ofs = 0;
  hepsiniDurdur(); basOfs = ofs; basZaman = hepsiniPlanla(ofs); oynuyor = true; btn.textContent = '⏸ Duraklat';
  document.getElementById('baslat').style.display = 'none';
}
function dur() { if (!oynuyor) return; basOfs = simdi(); oynuyor = false; hepsiniDurdur(); btn.textContent = '▶ Oynat'; }
function dongu() {
  let t = simdi();
  if (oynuyor && t >= AYAR.sure) { dur(); basOfs = AYAR.sure; t = AYAR.sure; if (kayitci) kayitci.stop(); }
  cizim(Math.max(0, t));
  if (!bar.matches(':active')) bar.value = t; zEl.textContent = `${fmt(t)} / ${fmt(AYAR.sure)}`;
  requestAnimationFrame(dongu);
}
btn.onclick = () => oynuyor ? dur() : oynat();
document.getElementById('baslat').onclick = () => oynat(0);
bar.oninput = () => { const v = +bar.value; if (oynuyor) { hepsiniDurdur(); oynat(v); } else basOfs = v; };
document.getElementById('altyaziKutu').onchange = e => AYAR.altyazi = e.target.checked;
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); oynuyor ? dur() : oynat(); } });
document.getElementById('kaydet').onclick = () => {
  if (kayitci) return; sesBaslat();
  const akis = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...SES.kayitHedef.stream.getAudioTracks()]);
  const tip = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'].find(m => MediaRecorder.isTypeSupported(m)) || '';
  const parca = []; kayitci = new MediaRecorder(akis, { mimeType: tip, videoBitsPerSecond: 12e6 });
  kayitci.ondataavailable = e => e.data.size && parca.push(e.data);
  kayitci.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(parca, { type: tip || 'video/webm' })); a.download = 'YasakOda_Bolum1.' + (tip.includes('mp4') ? 'mp4' : 'webm'); a.click(); kayitci = null; document.getElementById('kaydet').textContent = '🎬 Video Kaydet'; };
  document.getElementById('kaydet').textContent = '⏺ Kaydediliyor… (2:30)'; kayitci.start(); oynat(0);
};

// ?t=SANIYE → o kareyi göster (kontrol için), ?altyazi=0 → altyazısız
const q = new URLSearchParams(location.search);
if (q.get('altyazi') === '0') { AYAR.altyazi = false; document.getElementById('altyaziKutu').checked = false; }
if (q.has('t')) { basOfs = +q.get('t'); document.getElementById('baslat').style.display = 'none'; }
klasordenYukle();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(dongu));
</script>
