<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Annemin Yatağındaki Yabancı — 1. Bölüm</title>
<style>
@font-face{font-family:Nunito;font-weight:800;src:url(../ortak/font/nunito800.woff2),url(../ortak/font/nunito800x.woff2)}
@font-face{font-family:Nunito;font-weight:600;src:url(../ortak/font/nunito800.woff2),url(../ortak/font/nunito800x.woff2)}
@font-face{font-family:Oswald;font-weight:600;src:url(../ortak/font/oswald.woff2),url(../ortak/font/oswaldx.woff2)}
@font-face{font-family:Caveat;font-weight:600;src:url(../ortak/font/caveat.woff2),url(../ortak/font/caveatx.woff2)}
html,body{margin:0;background:#111;color:#ddd;font-family:Nunito,sans-serif;height:100%}
#sahne{display:block;margin:0 auto;height:calc(100vh - 56px);aspect-ratio:9/16;max-width:100vw;background:#000}
#ui{display:flex;gap:10px;align-items:center;justify-content:center;height:56px}
button{background:#333;color:#eee;border:0;padding:8px 14px;border-radius:6px;font:inherit;cursor:pointer}
input[type=range]{width:min(50vw,420px)}
</style></head><body>
<canvas id="sahne" width="1080" height="1920"></canvas>
<div id="ui"><button id="oynat">▶ Oynat</button><input id="bar" type="range" min="0" max="120" step="0.01" value="0"><span id="zaman">0:00</span><label><input id="alt" type="checkbox" checked> Altyazı</label></div>
<audio id="ses" src="bolum1_ses.m4a" preload="auto"></audio>
<script src="zaman.js"></script><script src="../ortak/temel.js"></script><script src="../ortak/karakter.js"></script><script src="../ortak/ev.js"></script><script src="js/temel_kurgu.js"></script><script src="js/sahneler.js"></script>
<script>
const cv = document.getElementById('sahne'), ctx = cv.getContext('2d'), ses = document.getElementById('ses'), bar = document.getElementById('bar');
bar.max = SURE;
const q = new URLSearchParams(location.search);
if (q.get('altyazi') === '0') { AYAR.altyazi = false; document.getElementById('alt').checked = false; }
document.getElementById('alt').onchange = e => AYAR.altyazi = e.target.checked;
let t0 = +(q.get('t') || 0);
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function dongu() { const t = ses.paused ? +bar.value : ses.currentTime; if (!ses.paused) bar.value = t; cizim(t, ctx); document.getElementById('zaman').textContent = fmt(t) + ' / ' + fmt(SURE); requestAnimationFrame(dongu); }
document.getElementById('oynat').onclick = () => { if (ses.paused) { ses.currentTime = +bar.value; ses.play(); document.getElementById('oynat').textContent = '❚❚ Durdur'; } else { ses.pause(); document.getElementById('oynat').textContent = '▶ Oynat'; } };
bar.oninput = () => { if (!ses.paused) ses.currentTime = +bar.value; };
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); document.getElementById('oynat').click(); } });
bar.value = t0;
Promise.all(['800 50px Nunito','600 50px Nunito','600 80px Oswald','600 50px Caveat'].map(f => document.fonts.load(f, 'ÇİŞĞÜÖ çışğüö'))).then(() => document.fonts.ready).then(() => { window.HAZIR = true; if (!q.has('kayit')) requestAnimationFrame(dongu); else cizim(t0, ctx); });
</script></body></html>
