<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Yastığımdaki Muska — Bugün 3 Bölüm</title>
<style>
  @font-face { font-family: 'Lora'; src: url('../animasyon/fontlar/Lora-Bold.ttf'); font-weight: 700; font-style: normal; }
  @font-face { font-family: 'Lora'; src: url('../animasyon/fontlar/Lora-SemiBoldItalic.ttf'); font-weight: 600; font-style: italic; }
  body { margin: 0; background: #111; } canvas { width: 405px; height: 720px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>const ZAMAN = { fps: 30, replikler: [] };</script>
<script src="../animasyon/motor.js"></script>
<script>
'use strict';
const KREM = '#f3e6d0', KIRMIZI = '#c0262f', KOYU = '#1a0507';
function yazi(g, s, x, y, font, renk, kontur = 0, aralik = 0) {
  g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle'; g.letterSpacing = aralik + 'px'; g.lineJoin = 'round';
  if (kontur) { g.lineWidth = kontur; g.strokeStyle = KOYU; g.strokeText(s, x, y); }
  g.fillStyle = renk; g.fillText(s, x, y); g.letterSpacing = '0px';
}
function zikzak(g, x0, x1, y, renk = '#b01f28', k = 6) { g.beginPath(); for (let x = x0, i = 0; x <= x1; x += 17, i++) { const yy = y + (i % 2 ? 8 : -8); i ? g.lineTo(x, yy) : g.moveTo(x, yy); } cizgi(g, k, renk); }
function resim(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; }); }
function saatIkon(g, x, y, r) {
  el(g, x, y, r, r); dol(g, '#f8efe0'); cizgi(g, 5, KOYU);
  for (let i = 0; i < 12; i++) { const a = i / 12 * TAU; g.beginPath(); g.moveTo(x + Math.cos(a) * r * .78, y + Math.sin(a) * r * .78); g.lineTo(x + Math.cos(a) * r * .9, y + Math.sin(a) * r * .9); cizgi(g, 3, KOYU); }
  const a1 = 7 / 12 * TAU - Math.PI / 2; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a1) * r * .5, y + Math.sin(a1) * r * .5); cizgi(g, 7, KOYU);
  g.beginPath(); g.moveTo(x, y); g.lineTo(x, y - r * .72); cizgi(g, 5, KOYU); el(g, x, y, 6, 6); dol(g, KIRMIZI);
}
function kart(g, img, x, y, w, h, bolum, ad, etiket, vurgu) {
  g.save();
  if (vurgu) { g.shadowColor = 'rgba(230,40,50,.9)'; g.shadowBlur = 50; }
  rr(g, x - 8, y - 8, w + 16, h + 16, 26); dol(g, vurgu ? KIRMIZI : '#e8dcc6'); g.shadowBlur = 0;
  g.save(); rr(g, x, y, w, h, 20); g.clip(); g.drawImage(img, x, y, w, h);
  g.fillStyle = dg(g, 0, y + h * .55, 0, y + h, [[0, 'rgba(8,2,3,0)'], [1, 'rgba(8,2,3,.92)']]); g.fillRect(x, y, w, h);
  if (!vurgu) { g.fillStyle = 'rgba(10,4,6,.18)'; g.fillRect(x, y, w, h); }
  g.restore(); rr(g, x, y, w, h, 20); cizgi(g, 5, KOYU);
  yazi(g, bolum, x + w / 2, y + h - 92, '700 40px "Lora"', '#fff4e4', 8, 2);
  yazi(g, ad, x + w / 2, y + h - 46, 'italic 600 27px "Lora"', '#e6c9ae');
  // alt etiket
  const ew = vurgu ? w + 20 : w - 30, ex = x + w / 2 - ew / 2, ey = y + h + 22;
  rr(g, ex, ey, ew, 66, 33); g.fillStyle = vurgu ? dg(g, 0, ey, 0, ey + 66, [[0, '#d3323b'], [1, '#8e1820']]) : 'rgba(243,230,208,.95)'; g.fill(); cizgi(g, 4, KOYU);
  yazi(g, etiket, x + w / 2, ey + 35, '700 32px "Lora"', vurgu ? '#fff4e4' : '#2a0b0e', 0, 1);
  g.restore();
}
(async () => {
  await document.fonts.load('700 40px "Lora"'); await document.fonts.load('italic 600 40px "Lora"');
  const [k1, k2, k3] = await Promise.all(['kapaklar/bolum1.jpg', 'kapaklar/bolum2.jpg', 'kapaklar/bolum3.jpg'].map(resim));
  const g = document.getElementById('c').getContext('2d');
  // zemin: koyu bordo + yaprak deseni + kırmızı iplik
  g.fillStyle = rg(g, W / 2, H * .45, 60, H * .78, [[0, '#4e161b'], [1, '#090304']]); g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,200,190,.05)';
  for (let y = 0, r = 0; y < H; y += 90, r++) for (let x = (r % 2) * 45; x < W; x += 90) { g.save(); g.translate(x, y); g.rotate(-.6); el(g, -5, 0, 5, 10, .5); g.fill(); el(g, 5, 0, 5, 10, -.5); g.fill(); g.restore(); }
  g.save(); g.globalAlpha = .35; dugumluIp(g, -40, 1120, 1395, 14, { t: 1, cozulmus: [0], cozulen: 1, cozulme: .4 }); g.restore();
  // logo
  yazi(g, 'YASTIĞIMDAKİ', W / 2, 120, '700 58px "Lora"', KREM, 0, 6);
  yazi(g, 'MUSKA', W / 2, 220, '700 132px "Lora"', KIRMIZI, 12);
  zikzak(g, 200, 880, 312);
  // başlık
  yazi(g, 'BUGÜN SİZLER İÇİN', W / 2, 400, '700 60px "Lora"', KREM, 9, 3);
  g.save(); g.translate(W / 2, 512); g.rotate(-.025);
  rr(g, -250, -70, 500, 140, 18); g.fillStyle = dg(g, 0, -70, 0, 70, [[0, '#d3323b'], [1, '#8e1820']]); g.fill(); cizgi(g, 7, KOYU);
  yazi(g, '3 BÖLÜM', 0, 6, '700 104px "Lora"', '#fff4e4', 0, 4); g.restore();
  yazi(g, 'PAYLAŞIYORUZ', W / 2, 640, '700 60px "Lora"', KREM, 9, 6);
  // bölüm kartları
  const w = 300, h = 533, y = 715;
  kart(g, k1, 40, y + 24, w, h, '1. BÖLÜM', 'Çeyizden Gelen Hediye', 'PROFİLDE', false);
  kart(g, k2, 390, y + 24, w, h, '2. BÖLÜM', 'Kırmızı İplik', 'PROFİLDE', false);
  kart(g, k3, 740, y, w, h + 10, '3. BÖLÜM', 'Kırk Düğüm', 'BU AKŞAM 19:00', true);
  // sonraki bölüm saati
  yazi(g, 'SONRAKİ BÖLÜM', W / 2, 1420, '700 54px "Lora"', '#e6c9ae', 8, 8);
  saatIkon(g, 290, 1555, 70);
  yazi(g, '19:00', 625, 1562, '700 168px "Lora"', KIRMIZI, 14, 2);
  zikzak(g, 200, 880, 1680, '#7a1a1f', 4);
  // mesaj
  yazi(g, 'Önceki 2 bölümü profilimizden', W / 2, 1752, 'italic 600 50px "Lora"', KREM);
  yazi(g, 'izleyebilirsiniz!', W / 2, 1815, 'italic 600 50px "Lora"', KREM);
  yazi(g, 'Bildirimleri aç, hiçbir bölümü kaçırma', W / 2, 1880, '700 36px "Lora"', '#c9a98a', 0, 1);
  window.HAZIR = true;
})();
</script>
</body>
</html>
